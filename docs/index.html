<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Griglie di valutazione</title>
  <style>
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #f7f9fc;
  --line: #dde3ec;
  --line-strong: #c5cfdd;
  --text: #1c2430;
  --muted: #667387;
  --accent: #2f5fb3;
  --accent-soft: #e6eefb;
  --good: #1f8a4c;
  --good-soft: #e5f5ec;
  --bad: #c0392b;
  --bad-soft: #fdecea;
  --warn: #a8670a;
  --warn-soft: #fff4e0;
  --radius: 8px;
  --shadow: 0 1px 2px rgba(20, 30, 50, .06), 0 2px 8px rgba(20, 30, 50, .05);
  --lv0: #e3f4ea;
  --lv1: #eef6dd;
  --lv2: #fff4dc;
  --lv3: #fde9de;
  --lvlow: #fbe1df;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}
h1 { font-size: 22px; margin: 2px 0; font-weight: 650; }
h2 { font-size: 18px; margin: 0 0 6px; font-weight: 650; }
h3 { font-size: 14px; margin: 18px 0 8px; font-weight: 650; }
a { color: var(--accent); }
input, select, textarea, button { font: inherit; color: inherit; }

input[type=text], input:not([type]), input.num, input[type=date], select, textarea {
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  padding: 5px 8px;
  background: #fff;
  min-width: 0;
}
input[type=text], textarea { width: 100%; }
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
input.num { width: 70px; text-align: right; }
input.invalid { border-color: var(--bad); background: var(--bad-soft); }
input:disabled { background: var(--surface-2); color: var(--muted); }

/* ---------- layout ---------- */
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 10;
}
.brand { border: 0; background: none; font-weight: 700; font-size: 15px; cursor: pointer; display: flex; gap: 8px; align-items: center; padding: 0; }
.logo { color: var(--accent); font-size: 18px; }
.crumb { color: var(--muted); }
main { padding: 20px; max-width: 1500px; margin: 0 auto; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.eyebrow { text-transform: uppercase; letter-spacing: .06em; font-size: 11px; color: var(--accent); font-weight: 650; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.panel { background: var(--surface); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 var(--radius) var(--radius); padding: 18px; box-shadow: var(--shadow); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin: 12px 0; box-shadow: var(--shadow); }
.panel .card { box-shadow: none; background: var(--surface-2); }
.row { display: flex; align-items: center; }
.row.gap { gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.row.end { align-self: flex-end; gap: 2px; }
.grow { flex: 1; min-width: 0; }
.spacer { flex: 1; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; align-items: start; }
.center { text-align: center; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.strong { font-weight: 650; }
.good { color: var(--good); }
.bad { color: var(--bad); }
.warn-text { color: var(--warn); }
.nowrap { white-space: nowrap; }
.empty { color: var(--muted); padding: 24px; text-align: center; background: var(--surface-2); border-radius: var(--radius); }

/* ---------- campi ---------- */
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field.inline { margin-bottom: 0; flex-direction: row; align-items: center; gap: 8px; }
.field-label { font-size: 12px; font-weight: 600; color: var(--muted); }
.hint { font-size: 12px; color: var(--muted); }
.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.check.small { font-size: 12px; color: var(--muted); margin: 6px 0; }
.check.tiny { font-size: 11px; color: var(--muted); gap: 3px; font-weight: 400; }
.pill { display: inline-block; padding: 4px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 600; }
.tag { display: inline-block; padding: 1px 6px; border-radius: 4px; background: var(--warn-soft); color: var(--warn); font-size: 11px; font-weight: 600; }

/* ---------- bottoni ---------- */
.btn {
  border: 1px solid var(--line-strong); background: #fff; border-radius: 6px;
  padding: 6px 12px; cursor: pointer; font-weight: 550; white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { background: #264f96; color: #fff; }
.btn.warn { background: var(--warn-soft); border-color: #e9c17a; color: var(--warn); }
.btn.danger:hover { border-color: var(--bad); color: var(--bad); }
.btn.small { padding: 3px 8px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: default; }
.icon-btn { border: 0; background: none; cursor: pointer; padding: 3px 6px; border-radius: 4px; color: var(--muted); }
.icon-btn:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.icon-btn:disabled { opacity: .3; cursor: default; }
.link { border: 0; background: none; color: var(--accent); cursor: pointer; text-align: left; padding: 0; font-weight: 550; }
.link:hover { text-decoration: underline; }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.panel .tabs { margin-top: 14px; }
.tab {
  border: 1px solid transparent; border-bottom: 0; background: none; padding: 8px 14px; cursor: pointer;
  border-radius: 6px 6px 0 0; color: var(--muted); font-weight: 550; white-space: nowrap;
}
.tab:hover { color: var(--text); }
.tab.active { background: var(--surface); border-color: var(--line); color: var(--accent); margin-bottom: -1px; }
.badge { margin-left: 6px; background: var(--accent-soft); color: var(--accent); border-radius: 99px; padding: 0 7px; font-size: 11px; }
.badge.warn { background: var(--warn-soft); color: var(--warn); }

/* ---------- tabelle ---------- */
.table-scroll { overflow-x: auto; margin: 8px 0; }
.tbl { border-collapse: collapse; width: 100%; background: #fff; }
.tbl th, .tbl td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; vertical-align: middle; }
.tbl thead th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--surface-2); border-bottom: 1px solid var(--line-strong); }
.tbl tfoot td, .tbl tfoot th { border-top: 1px solid var(--line-strong); font-weight: 600; background: var(--surface-2); }
.tbl.compact th, .tbl.compact td { padding: 4px 6px; }
.tbl .c { text-align: center; }
.tbl .right { text-align: right; }
.tbl tr.dim td { opacity: .5; }
.tbl th.vert { height: 110px; vertical-align: bottom; padding-bottom: 8px; }
.tbl th.vert span { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; max-height: 100px; overflow: hidden; text-overflow: ellipsis; display: inline-block; }
.tbl td.off { background: #f0f2f5; color: #aab; text-align: center; }
.tbl.matrix td { font-variant-numeric: tabular-nums; }
.summary tbody tr:hover td { background: var(--accent-soft); }

/* ---------- indicatori ---------- */
.levels-tbl { margin: 6px 0 8px; }
.levels-tbl td { vertical-align: top; }
.levels-tbl .lv-name { width: 170px; }
.levels-tbl .lv-pct { width: 100px; padding-top: 9px; }
.levels-tbl td.c { padding-top: 9px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; gap: 4px; align-items: center; border: 1px solid var(--line-strong); border-radius: 99px; padding: 2px 10px; font-size: 13px; cursor: pointer; background: #fff; }
.chip.on { border-color: var(--accent); background: var(--accent-soft); }
.total-line { margin: 10px 0; font-weight: 650; }
.total-big { font-size: 22px; font-weight: 700; color: var(--accent); line-height: 1.2; }

/* ---------- alert / toast / busy ---------- */
.alert { border-radius: var(--radius); padding: 10px 14px; margin: 12px 0; font-size: 13px; }
.alert.warn { background: var(--warn-soft); color: #6e4504; border: 1px solid #f0d49e; }
.alert.info { background: var(--accent-soft); border: 1px solid #c4d5f3; }
.err-box { white-space: pre-wrap; font: 12px/1.4 Consolas, monospace; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 10px; max-height: 220px; overflow: auto; user-select: all; }
.modal-back {
  position: fixed; inset: 0; z-index: 60; background: rgba(28, 36, 48, .35);
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.modal { background: var(--surface); border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.25); padding: 20px 22px; max-width: 460px; width: 100%; }
.modal p { margin: 0 0 18px; }
.end-row { justify-content: flex-end; }
.btn.danger-solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.danger-solid:hover { background: #a3301f; color: #fff; }
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 50;
  background: #1c2430; color: #fff; padding: 10px 18px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.2);
  max-width: min(90vw, 640px); cursor: pointer;
}
.toast.error { background: var(--bad); }
.busy {
  position: fixed; inset: 0; background: rgba(244, 246, 249, .7); z-index: 40;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font-weight: 600;
}
.spinner { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.save-error { color: var(--bad); }
.save-saving, .save-pending { color: var(--warn); }

/* ---------- home ---------- */
.home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.card.mode { padding: 22px; margin: 0; }
.mode-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 10px; }
.file-list { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
.file-list li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }

/* ---------- griglia ---------- */
.grid-preview { overflow-x: auto; margin: 14px 0; padding: 12px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); }

/* ---------- correzione ---------- */
.eval-layout { display: grid; grid-template-columns: 230px 1fr; gap: 16px; align-items: start; }
.student-list { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 64px; max-height: calc(100vh - 90px); overflow-y: auto; }
.student {
  display: flex; flex-direction: column; align-items: flex-start; text-align: left;
  border: 1px solid transparent; background: none; border-radius: 6px; padding: 6px 10px; cursor: pointer;
  border-left: 3px solid var(--line);
}
.student:hover { background: var(--surface-2); }
.student.active { background: var(--accent-soft); border-color: #c4d5f3; border-left-color: var(--accent); }
.student .name { font-weight: 600; }
.student .meta { font-size: 11px; color: var(--muted); }
.student.done { border-left-color: var(--good); }
.student.partial { border-left-color: #e5a43a; }
.student.absent .name { color: var(--muted); text-decoration: line-through; }
.eval-main { min-width: 0; }
.eval-head h2 { margin: 0; }
.tbl.eval th, .tbl.eval td { border: 1px solid var(--line); text-align: center; }
.tbl.eval .ind-name { text-align: left; min-width: 210px; max-width: 280px; font-weight: 600; background: var(--surface-2); vertical-align: top; }
.tbl.eval tr.row-focus .ind-name { background: var(--accent-soft); }

/* legenda delle fasce dei livelli nella colonna degli indicatori */
.bands { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; font-weight: 400; }
.band {
  display: flex; gap: 8px; align-items: baseline; font-size: 11px; line-height: 1.35;
  padding: 1px 6px; border-left: 4px solid var(--line-strong); border-radius: 3px;
}
.band .b-range { min-width: 64px; font-variant-numeric: tabular-nums; color: var(--text); white-space: nowrap; }
.band .b-name { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.band.active { font-weight: 650; }
.band.active .b-name { color: var(--text); }
.band.lv0 { border-left-color: #3fae6a; } .band.lv0.active { background: var(--lv0); }
.band.lv1 { border-left-color: #9cc85c; } .band.lv1.active { background: var(--lv1); }
.band.lv2 { border-left-color: #e3b23c; } .band.lv2.active { background: var(--lv2); }
.band.lv3 { border-left-color: #e8894d; } .band.lv3.active { background: var(--lv3); }
.band.lvlow { border-left-color: #d9534f; } .band.lvlow.active { background: var(--lvlow); }
.band { cursor: help; }
.band.hover { outline: 1px solid var(--line-strong); background: #fff; }

/* barra del descrittore: resta in fondo allo schermo mentre correggi */
.desc-bar {
  position: sticky; bottom: 8px; z-index: 5; margin: 10px 0;
  background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--line-strong);
  border-radius: var(--radius); box-shadow: 0 4px 16px rgba(20, 30, 50, .10);
  padding: 9px 14px; min-height: 58px; font-size: 13px;
}
.desc-bar.empty { box-shadow: none; display: flex; align-items: center; }
.desc-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 3px; }
.desc-ind { font-weight: 650; }
.desc-level { font-weight: 650; padding: 0 7px; border-radius: 4px; }
.desc-text { white-space: pre-line; }
.desc-bar.lv0 { border-left-color: #3fae6a; } .desc-level.lv0 { background: var(--lv0); }
.desc-bar.lv1 { border-left-color: #9cc85c; } .desc-level.lv1 { background: var(--lv1); }
.desc-bar.lv2 { border-left-color: #e3b23c; } .desc-level.lv2 { background: var(--lv2); }
.desc-bar.lv3 { border-left-color: #e8894d; } .desc-level.lv3 { background: var(--lv3); }
.desc-bar.lvlow { border-left-color: #d9534f; } .desc-level.lvlow { background: var(--lvlow); }
.tbl.eval .ex-head { min-width: 74px; }
.tbl.eval tr.sub th { background: #fff; padding: 2px; }
.tbl.eval td.cell { padding: 4px; }
.tbl.eval td.cell input.num { width: 58px; text-align: center; font-weight: 600; }
.tbl.eval td.ns { background: var(--bad-soft); color: var(--bad); font-size: 12px; }
.tbl.eval .lvname { font-size: 10.5px; color: var(--muted); min-height: 14px; }
.tbl.eval td.lv0 { background: var(--lv0); }
.tbl.eval td.lv1 { background: var(--lv1); }
.tbl.eval td.lv2 { background: var(--lv2); }
.tbl.eval td.lv3 { background: var(--lv3); }
.tbl.eval td.lvlow { background: var(--lvlow); }
.tbl.eval .ind-res { min-width: 110px; background: var(--surface-2); }
.closed-counts { margin: 6px 0 8px; gap: 22px; }
.closed-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.closed-q { display: flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 6px; padding: 3px 4px 3px 8px; background: #fff; }
.closed-q .qn { min-width: 30px; font-weight: 600; font-size: 12px; }
.qbtn { width: 26px; height: 26px; border: 1px solid var(--line); background: #fff; border-radius: 4px; cursor: pointer; color: var(--muted); }
.qbtn.qC.on { background: var(--good); border-color: var(--good); color: #fff; }
.qbtn.qE.on { background: var(--bad); border-color: var(--bad); color: #fff; }
.qbtn.qN.on { background: #8a94a6; border-color: #8a94a6; color: #fff; }
.result-bar, .stats {
  display: flex; flex-wrap: wrap; gap: 28px; align-items: baseline;
  background: var(--accent-soft); border-radius: var(--radius); padding: 12px 18px; margin: 14px 0;
}
.result-bar > div, .stats > div { display: flex; gap: 6px; align-items: baseline; }
.result-bar b, .stats b { font-size: 20px; }
.result-bar .big b { font-size: 26px; color: var(--accent); }

@media (max-width: 900px) {
  main { padding: 12px 16px; }
  .home-grid, .grid2, .grid3 { grid-template-columns: 1fr; }
  .eval-layout { grid-template-columns: 1fr; }
  .student-list { position: static; max-height: 220px; }
}

</style>
  <script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.umd.js"></script>

<body>
  <div id="app"></div>
  <script>
(function () {
'use strict';
// ---- core.js ----
/* =====================================================================
 * core.js — utilità e motore di calcolo delle griglie
 * ===================================================================== */

const U = {
  uid(prefix) {
    return (prefix || 'id') + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
  },
  clone(o) { return JSON.parse(JSON.stringify(o)); },
  sum(arr, f) { return arr.reduce((s, x) => s + (f ? f(x) : x), 0); },
  /** Converte input (anche "14,5") in numero, oppure null. */
  num(v) {
    if (v === null || v === undefined || v === '') return null;
    const n = typeof v === 'number' ? v : parseFloat(String(v).trim().replace(',', '.'));
    return Number.isFinite(n) ? n : null;
  },
  round(n, d) {
    const f = Math.pow(10, d === undefined ? 2 : d);
    return Math.round((n + Number.EPSILON) * f) / f;
  },
  clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); },
  /** Formato italiano con al massimo d decimali (8,75 — 9 — 7,5). */
  fmt(n, d) {
    if (n === null || n === undefined || !Number.isFinite(n)) return '';
    return U.round(n, d === undefined ? 2 : d).toLocaleString('it-IT', { maximumFractionDigits: d === undefined ? 2 : d, useGrouping: false });
  },
  /** Formato italiano con esattamente d decimali (8,50). */
  fmtFixed(n, d) {
    if (n === null || n === undefined || !Number.isFinite(n)) return '';
    return n.toLocaleString('it-IT', { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: false });
  },
  todayISO() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  },
  dateIT(iso) {
    if (!iso) return '';
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
    return m ? m[3] + '/' + m[2] + '/' + m[1] : iso;
  },
  /** Nome file sicuro. */
  safeName(s) { return String(s || '').replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim() || 'senza nome'; },
  esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  },
  /** Distribuisce `total` (intero) proporzionalmente a values, restituendo interi (metodo dei resti maggiori). */
  largestRemainder(values, total) {
    const floors = values.map(v => Math.floor(v));
    let rem = Math.round(total - U.sum(floors));
    const order = values.map((v, i) => [v - Math.floor(v), i]).sort((a, b) => b[0] - a[0]);
    for (let k = 0; rem > 0 && order.length; k = (k + 1) % order.length, rem--) floors[order[k][1]]++;
    return floors;
  },
  studentName(s) { return ((s.cognome || '') + ' ' + (s.nome || '')).trim(); },
  compareStudents(a, b) {
    return (a.cognome || '').localeCompare(b.cognome || '', 'it') || (a.nome || '').localeCompare(b.nome || '', 'it');
  }
};

/* ---------------------------------------------------------------------
 * Modello dati
 * ------------------------------------------------------------------- */
const Model = {
  SCHEMA: 1,
  BES_TYPES: ['DSA', 'NAI', 'PEI'],

  /** Livelli dal più alto: `max` è la percentuale massima del livello (il più alto è sempre 100). */
  defaultLevels() {
    return [
      ['Eccellente', 100], ['Buono', 80], ['Sufficiente', 60], ['Insufficiente', 45], ['Gravemente insufficiente', 30]
    ].map(([nome, max]) => ({ id: U.uid('lv'), nome, max, descrittore: '' }));
  },

  /** Copia di una scala di livelli con nuovi id (i descrittori si mantengono se richiesto). */
  copyLevels(levels, keepDesc) {
    return levels.map(l => ({ id: U.uid('lv'), nome: l.nome, max: l.max, descrittore: keepDesc ? (l.descrittore || '') : '' }));
  },

  /** Converte i livelli del vecchio formato (percentuale minima) nel nuovo (percentuale massima). */
  migrateLevels(levels, descrittori) {
    const sorted = [...levels].sort((a, b) => (U.num(b.min) || 0) - (U.num(a.min) || 0));
    return sorted.map((l, i) => ({
      id: l.id, nome: l.nome,
      max: i === 0 ? 100 : Math.max(0, (U.num(sorted[i - 1].min) || 0) - 1),
      descrittore: (descrittori || {})[l.id] || ''
    }));
  },

  newTemplate() {
    const now = new Date().toISOString();
    return {
      schema: Model.SCHEMA, tipo: 'template', id: U.uid('tpl'),
      materia: '', argomento: '', intestazione: '', descrizione: '',
      votoMin: 2,
      votoModo: 'soglia',
      distribuzione: 'proporzionale',
      notaPiede: 'La valutazione fa riferimento all’eventuale PDP/PEI redatto dal consiglio di classe.',
      notaPiedeQuando: 'bes',
      livelli: Model.defaultLevels(),
      indicatori: [],
      esercizi: [],
      // singole: quante domande a risposta singola (DS) e quanto vale ciascuna;
      // domande: le domande a risposta multipla (DM), ognuna con nome, parti e punti
      chiuse: { attive: false, singole: { numero: 0, punti: 1 }, domande: [], errata: 0, nonData: 0, minimoZero: true },
      versioni: [],
      creato: now, modificato: now
    };
  },

  newIndicator(t) {
    return { id: U.uid('ind'), nome: '', max: 20, livelli: Model.copyLevels(t.livelli, false) };
  },

  newExercise(t, list) {
    const n = (list || t.esercizi).length + 1;
    return { id: U.uid('es'), nome: 'DV' + n, testo: '', indicatori: t.indicatori.map(i => i.id), bias: 0 };
  },

  /*
   * Nomi automatici: DV = domande da valutare, DS = chiuse a risposta singola,
   * DM = chiuse a risposta multipla. Si rinumerano solo i nomi automatici
   * (anche quelli delle versioni precedenti: "Es 3", "D5"); quelli scelti a mano restano.
   */
  AUTO_DV: /^(Es ?|DV)\d+$/i,
  AUTO_CLOSED: /^(D|DS|DM)\d+$/i,

  renumber(t) {
    let k = 0;
    t.esercizi.forEach(e => { k++; if (Model.AUTO_DV.test(String(e.nome).trim())) e.nome = 'DV' + k; });
    (t.versioni || []).forEach(v => {
      let j = k;
      (v.aggiunti || []).forEach(e => { j++; if (Model.AUTO_DV.test(String(e.nome).trim())) e.nome = 'DV' + j; });
    });
    // le multiple aggiunte in una versione continuano la numerazione di quelle della verifica base
    let m = 0;
    ((t.chiuse && t.chiuse.domande) || []).forEach(q => { m++; if (Model.AUTO_CLOSED.test(String(q.nome).trim())) q.nome = 'DM' + m; });
    (t.versioni || []).forEach(v => {
      let j = m;
      (v.chiuseAggiunte || []).forEach(q => { j++; if (Model.AUTO_CLOSED.test(String(q.nome).trim())) q.nome = 'DM' + j; });
    });
    return t;
  },

  newMultiple() { return { id: U.uid('q'), nome: 'DM0', tipo: 'composta', parti: 4, punti: 4 }; },

  /**
   * Converte le domande chiuse del formato precedente (ogni risposta singola elencata con
   * il suo nome) nel formato attuale: numero di singole + punti, e solo le multiple in elenco.
   * Restituisce gli id delle singole eliminate (servono per convertire le valutazioni).
   */
  migrateClosed(chiuse) {
    const isMulti = q => q.tipo === 'composta' || q.tipo === 'associazione';
    const old = (chiuse.domande || []).filter(q => !isMulti(q));
    if (!old.length) return [];
    if (!chiuse.singole || !chiuse.singole.numero) {
      chiuse.singole = { numero: old.length, punti: U.num(old[0].punti) || 0 };
    }
    chiuse.domande = chiuse.domande.filter(isMulti);
    return old.map(q => q.id);
  },

  newVersion(tipo) {
    return {
      id: U.uid('ver'), nome: tipo === 'ALTRO' ? 'Personalizzata' : tipo, tipo, esclusi: [], testi: {}, adj: {}, aggiunti: [],
      chiuseSingole: null,   // numero di risposte singole in questa versione (null = come la verifica base)
      chiuseEscluse: [],     // risposte multiple della verifica base non incluse
      chiuseAggiunte: []     // risposte multiple solo di questa versione
    };
  },

  newSession(template, templateFileId) {
    const now = new Date().toISOString();
    return {
      schema: Model.SCHEMA, tipo: 'sessione', id: U.uid('ses'),
      template: U.clone(template), templateFileId: templateFileId || null,
      classe: '', data: U.todayISO(), studenti: [],
      creato: now, modificato: now
    };
  },

  newStudent(cognome, nome, versione) {
    return { id: U.uid('stu'), cognome: cognome || '', nome: nome || '', bes: '', versione: versione || 'std', data: '', assente: false, punteggi: {}, nonSvolti: {}, chiuse: {}, chiuseConteggi: {}, chiuseParziali: {}, note: '' };
  },

  /** Rende coerente un oggetto caricato da file (campi mancanti, schemi futuri). */
  normalizeTemplate(t) {
    const base = Model.newTemplate();
    const out = Object.assign(base, t);
    out.chiuse = Object.assign(Model.newTemplate().chiuse, U.clone(t.chiuse || {}));
    const oldSingle = Model.migrateClosed(out.chiuse);
    out.versioni = (t.versioni || []).map(v => {
      const nv = Object.assign(Model.newVersion(v.tipo || 'ALTRO'), U.clone(v));
      // formato precedente: le singole escluse in una versione diventano un numero minore
      if (oldSingle.length && nv.chiuseSingole == null) {
        const tolte = (nv.chiuseEscluse || []).filter(id => oldSingle.includes(id)).length;
        if (tolte) nv.chiuseSingole = Math.max(0, oldSingle.length - tolte);
      }
      nv.chiuseEscluse = (nv.chiuseEscluse || []).filter(id => !oldSingle.includes(id));
      return nv;
    });
    delete out.totale; // il totale ora si ricava dagli indicatori e dalle domande chiuse
    const oldFormat = l => l && l.length && l[0].min !== undefined && l[0].max === undefined;
    const tplLevels = t.livelli && t.livelli.length ? t.livelli : Model.defaultLevels();
    out.livelli = oldFormat(tplLevels) ? Model.migrateLevels(tplLevels) : tplLevels;
    out.indicatori = (t.indicatori || []).map(i => {
      const ind = Object.assign({}, i);
      if (!ind.livelli || !ind.livelli.length) {
        ind.livelli = oldFormat(tplLevels) ? Model.migrateLevels(tplLevels, i.descrittori) : Model.copyLevels(out.livelli, false);
      }
      delete ind.descrittori;
      ind.livelli = Calc.sortedLevels(ind.livelli);
      ind.livelli[0].max = 100;
      return ind;
    });
    out.esercizi = (t.esercizi || []).map(e => Object.assign({ testo: '', indicatori: [], bias: 0 }, e));
    return Model.renumber(out);
  },

  normalizeSession(s) {
    const out = Object.assign(Model.newSession(Model.newTemplate()), s);
    // formato precedente: risposte singole segnate una per una -> conteggi
    const isMulti = q => q.tipo === 'composta' || q.tipo === 'associazione';
    const oldSingle = (((s.template || {}).chiuse || {}).domande || []).filter(q => !isMulti(q)).map(q => q.id);
    out.template = Model.normalizeTemplate(s.template || {});
    out.studenti = (s.studenti || []).map(st => {
      const r = Object.assign(Model.newStudent(), st);
      const k = r.chiuseConteggi || {};
      if (oldSingle.length && k.C == null && k.E == null && k.N == null && r.chiuse && Object.keys(r.chiuse).length) {
        const c = { C: 0, E: 0, N: 0 };
        oldSingle.forEach(id => { const a = r.chiuse[id]; if (c[a] !== undefined) c[a]++; });
        r.chiuseConteggi = c;
      }
      return r;
    });
    return out;
  },

  /** Associa il valore della colonna BES a una versione del template. */
  versionForBes(t, bes) {
    const b = String(bes || '').trim().toUpperCase();
    if (!b || b === 'NO' || b === 'STANDARD') return 'std';
    const v = t.versioni.find(x => x.tipo === b) || t.versioni.find(x => x.nome.toUpperCase() === b);
    return v ? v.id : 'std';
  },

  versionName(t, vId) {
    if (!vId || vId === 'std') return 'Standard';
    const v = t.versioni.find(x => x.id === vId);
    return v ? v.nome : 'Standard';
  },

  templateTitle(t) {
    return [t.materia, t.argomento].filter(Boolean).join(' — ') || 'Verifica senza titolo';
  },

  templateFileName(t) { return U.safeName(Model.templateTitle(t)) + '.json'; },

  sessionFileName(s) {
    return U.safeName([s.classe || 'classe', s.template.argomento || s.template.materia, s.data].filter(Boolean).join(' - ')) + '.json';
  }
};

/* ---------------------------------------------------------------------
 * Motore di calcolo
 *
 * Ogni esercizio i ha un peso intero w_i (punti). Ogni casella
 * (esercizio i, indicatore j) riceve una quota p_ij di quel peso.
 * Il punteggio di un esercizio è la somma per riga, quello di un
 * indicatore la somma per colonna: entrambe partono dalla stessa
 * matrice, quindi i totali coincidono sempre.
 * ------------------------------------------------------------------- */
const Calc = {
  indicator(t, id) { return t.indicatori.find(i => i.id === id); },

  /** Livelli dal più alto al più basso; il primo vale sempre fino al 100 %. */
  sortedLevels(levels) {
    return [...(levels || [])].sort((a, b) => (U.num(b.max) || 0) - (U.num(a.max) || 0));
  },

  /**
   * Fasce di punteggio di ogni livello per un indicatore di massimo `max` (dal più alto), anche decimali.
   * Un livello arriva fino a max% × massimo (incluso) e parte appena sopra il limite del livello inferiore;
   * il livello più basso parte da 0 (incluso). Es. su 15 punti: Insufficiente "> 4,5 – 6,75".
   */
  levelRanges(levels, max) {
    const sorted = Calc.sortedLevels(levels);
    const tos = sorted.map((l, i) => i === 0 ? max : U.round((U.num(l.max) || 0) / 100 * max, 2));
    return sorted.map((l, i) => {
      const last = i === sorted.length - 1;
      const from = last ? 0 : tos[i + 1];
      return { level: l, from, to: tos[i], fromIncluded: last, empty: last ? tos[i] < 0 : tos[i] <= from };
    });
  },

  /** Etichetta di una fascia: "0 – 4,5" per la più bassa, "> 4,5 – 6,75" per le altre. */
  rangeLabel(r) {
    if (r.empty) return '–';
    return (r.fromIncluded ? '' : '> ') + U.fmt(r.from) + ' – ' + U.fmt(r.to);
  },

  /** Problemi di una scala di livelli (percentuali non decrescenti, livelli vuoti). */
  levelIssues(levels, max) {
    const issues = [];
    const sorted = Calc.sortedLevels(levels);
    const name = l => '«' + (l.nome || 'livello senza nome') + '»';
    sorted.forEach((l, i) => { if (i > 0 && (U.num(l.max) || 0) >= 100) issues.push(name(l) + ': solo il livello più alto può arrivare al 100 %.'); });
    Calc.levelRanges(levels, max).forEach(r => { if (r.empty) issues.push(name(r.level) + ' non contiene nessun punteggio su ' + max + '.'); });
    return issues;
  },

  /** Voto in decimi: lineare sul punteggio, con voto minimo (soglia o scala dal minimo). */
  voto(t, totale, maxTot) {
    if (!(maxTot > 0)) return 0;
    const min = U.clamp(U.num(t.votoMin) || 0, 0, 10);
    const ratio = U.clamp(totale / maxTot, 0, 1);
    const v = t.votoModo === 'lineare' ? min + ratio * (10 - min) : Math.max(min, ratio * 10);
    return U.round(v, 2);
  },

  votoRule(t, maxTot) {
    const min = U.num(t.votoMin) || 0;
    const T = U.fmt(maxTot);
    if (!min) return 'punteggio / ' + T + ' × 10, arrotondato al mezzo voto';
    if (t.votoModo === 'lineare') return U.fmt(min) + ' + punteggio / ' + T + ' × ' + U.fmt(10 - min) + ', arrotondato al mezzo voto';
    return 'punteggio / ' + T + ' × 10 (minimo ' + U.fmt(min) + '), arrotondato al mezzo voto';
  },

  levelOf(levels, max, score) {
    if (score === null || score === undefined) return null;
    const ranges = Calc.levelRanges(levels, max);
    const r = ranges.find(x => !x.empty && (x.fromIncluded ? score >= x.from : score > x.from)) || ranges[ranges.length - 1];
    return r ? r.level : null;
  },

  version(t, vId) {
    if (!vId || vId === 'std') return null;
    return t.versioni.find(v => v.id === vId) || null;
  },

  /**
   * Domande chiuse incluse nella versione: ognuna vale i suoi punti, il blocco vale la loro somma.
   * singole: corretta / errata / non data; composte: risposte con più parti (associazioni,
   * cloze, completamenti…), con punteggio parziale proporzionale alle parti corrette.
   */
  closed(t, vId) {
    const c = t.chiuse;
    if (!c.attive) return { items: [], singole: [], composte: [], max: 0, all: 0, uniform: true };
    const v = Calc.version(t, vId);
    const val = U.num(c.singole && c.singole.punti) || 0;
    const nBase = Math.max(0, Math.round(U.num(c.singole && c.singole.numero) || 0));
    const n = v && v.chiuseSingole != null ? Math.max(0, Math.round(U.num(v.chiuseSingole) || 0)) : nBase;
    // le singole non hanno un nome proprio: si contano soltanto (DS1..DSn)
    const singole = Array.from({ length: n }, (_, k) => ({ id: 'ds' + (k + 1), nome: 'DS' + (k + 1), tipo: 'singola', valore: val }));
    const multi = q => Object.assign({}, q, { valore: U.num(q.punti) || 0, tipo: 'composta', parti: Calc.partsOf(q) });
    const composte = c.domande.filter(q => !v || !v.chiuseEscluse.includes(q.id)).map(multi)
      .concat(v ? (v.chiuseAggiunte || []).map(multi) : []);
    const items = singole.concat(composte);
    const all = nBase * val + U.sum(c.domande, q => U.num(q.punti) || 0);
    return { items, singole, composte, max: U.sum(items, q => q.valore), all, uniform: true };
  },

  /** Domanda a risposta composta ('associazione' è il nome usato nelle prime versioni dell'app). */
  isComposite(q) { return q.tipo === 'composta' || q.tipo === 'associazione'; },

  partsOf(q) { return Math.max(1, Math.round(U.num(q.parti != null ? q.parti : q.coppie) || 1)); },

  /**
   * Conteggi corrette / errate / non date delle domande a risposta singola.
   * Usa i numeri inseriti (chiuseConteggi); per le valutazioni salvate prima, li ricava
   * dalle risposte segnate domanda per domanda.
   */
  closedCounts(rec, C) {
    const k = rec.chiuseConteggi;
    if (C.uniform && k && (k.C != null || k.E != null || k.N != null)) {
      return { C: U.num(k.C) || 0, E: U.num(k.E) || 0, N: U.num(k.N) || 0 };
    }
    const out = { C: 0, E: 0, N: 0 };
    C.singole.forEach(q => { const a = rec.chiuse ? rec.chiuse[q.id] : null; if (out[a] !== undefined) out[a]++; });
    return out;
  },

  /** Parti corrette inserite per una domanda a risposta composta (null se non inserite). */
  partialValue(rec, q) {
    const src = rec.chiuseParziali && rec.chiuseParziali[q.id] != null ? rec.chiuseParziali : rec.chiuseAssoc;
    const x = U.num(src ? src[q.id] : null);
    return x === null ? null : U.clamp(x, 0, q.parti);
  },

  /** Punti degli esercizi valutati con la griglia in una versione. */
  manualTotal(t, vId) {
    const w = Calc.weights(t, vId);
    return U.sum(Calc.exercises(t, vId), e => w[e.id] || 0);
  },

  /** Punteggio totale di una versione: esercizi + domande chiuse (non è un valore fisso). */
  total(t, vId) { return Calc.manualTotal(t, vId) + Calc.closed(t, vId).max; },

  /** Esercizi di una versione (testi personalizzati applicati). */
  exercises(t, vId) {
    const v = Calc.version(t, vId);
    let list = t.esercizi
      .filter(e => !v || !v.esclusi.includes(e.id))
      .map(e => Object.assign({}, e, { testo: v && v.testi[e.id] ? v.testi[e.id] : e.testo, aggiunto: false }));
    if (v) list = list.concat(v.aggiunti.map(e => Object.assign({}, e, { aggiunto: true })));
    return list;
  },

  validIndicators(t, ex) { return ex.indicatori.filter(id => Calc.indicator(t, id)); },

  /** Quanti esercizi della lista coprono ciascun indicatore. */
  coverage(t, list) {
    const c = {};
    list.forEach(e => Calc.validIndicators(t, e).forEach(id => { c[id] = (c[id] || 0) + 1; }));
    return c;
  },

  /**
   * Quota di ogni indicatore dentro un esercizio: il punteggio dell'indicatore
   * si divide in parti uguali tra gli esercizi che lo coprono.
   */
  shares(t, ex, cov) {
    const out = {};
    Calc.validIndicators(t, ex).forEach(id => {
      out[id] = (U.num(Calc.indicator(t, id).max) || 0) / Math.max(1, cov[id] || 0);
    });
    return out;
  },

  /** "Grezzo" di un esercizio: somma delle quote degli indicatori che copre. */
  raw(t, ex, cov) { return U.sum(Object.values(Calc.shares(t, ex, cov || Calc.coverage(t, t.esercizi)))); },

  /**
   * Pesi della versione standard. Il grezzo di ogni esercizio (somma delle quote degli indicatori)
   * viene arrotondato a interi con il metodo dei resti maggiori, così la somma resta uguale alla
   * somma dei massimi degli indicatori; poi si aggiunge la correzione (bias).
   */
  standardWeights(t) {
    const cov = Calc.coverage(t, t.esercizi);
    const raws = t.esercizi.map(e => Calc.raw(t, e, cov));
    const R = U.sum(raws);
    const bases = U.largestRemainder(raws, Math.round(R));
    const out = {};
    t.esercizi.forEach((e, i) => {
      const bias = U.num(e.bias) || 0;
      out[e.id] = { raw: raws[i], base: bases[i], bias, peso: Math.max(0, bases[i] + bias) };
    });
    return { rows: out, R, cov, biasSum: U.sum(t.esercizi, e => U.num(e.bias) || 0) };
  },

  /**
   * Pesi finali di una versione: { exId: peso }.
   * Nelle versioni ogni esercizio mantiene il punteggio che ha nella standard (più l'eventuale
   * correzione della versione): il totale della versione è la somma di ciò che contiene.
   */
  weights(t, vId) {
    const std = Calc.standardWeights(t);
    const v = Calc.version(t, vId);
    const out = {};
    if (!v) {
      Object.keys(std.rows).forEach(id => { out[id] = std.rows[id].peso; });
      return out;
    }
    Calc.exercises(t, vId).forEach(e => {
      const base = e.aggiunto
        ? Math.max(0, Math.round(Calc.raw(t, e, std.cov)) + (U.num(e.bias) || 0))
        : (std.rows[e.id] ? std.rows[e.id].peso : 0);
      out[e.id] = Math.max(0, base + (U.num(v.adj[e.id]) || 0));
    });
    return out;
  },

  /** Matrice dei punti massimi per casella. */
  matrix(t, vId) {
    const exs = Calc.exercises(t, vId);
    const W = Calc.weights(t, vId);
    const usedIds = new Set();
    exs.forEach(e => Calc.validIndicators(t, e).forEach(id => usedIds.add(id)));
    const used = t.indicatori.filter(i => usedIds.has(i.id));
    // le quote degli indicatori si calcolano sulla verifica standard: togliere un esercizio
    // in una versione toglie anche la sua parte di indicatori
    const cov = Calc.coverage(t, t.esercizi);
    const nominal = {};
    used.forEach(i => { nominal[i.id] = 0; });
    const rows = exs.map(ex => {
      const sh = Calc.shares(t, ex, cov);
      const raw = U.sum(Object.values(sh));
      const cells = {};
      Object.keys(sh).forEach(id => {
        cells[id] = raw > 0 ? (W[ex.id] || 0) * sh[id] / raw : 0;
        nominal[id] += sh[id];
      });
      return { ex, peso: W[ex.id] || 0, cells };
    });
    const Tm = U.sum(rows, r => r.peso);

    if (t.distribuzione === 'bilanciata' && rows.length && used.length) {
      // Iterative proportional fitting: colonne verso il peso previsto (riscalato sul totale), righe fisse sul peso dell'esercizio
      const totNom = U.sum(used, i => nominal[i.id]);
      const target = {};
      used.forEach(i => { target[i.id] = totNom > 0 ? nominal[i.id] * Tm / totNom : 0; });
      for (let it = 0; it < 500; it++) {
        used.forEach(i => {
          const cs = U.sum(rows, r => r.cells[i.id] || 0);
          if (cs > 0) rows.forEach(r => { if (r.cells[i.id] !== undefined) r.cells[i.id] *= target[i.id] / cs; });
        });
        rows.forEach(r => {
          const rs = U.sum(Object.values(r.cells));
          if (rs > 0) Object.keys(r.cells).forEach(k => { r.cells[k] *= r.peso / rs; });
        });
      }
    }
    const eff = {};
    used.forEach(i => { eff[i.id] = U.sum(rows, r => r.cells[i.id] || 0); });
    return { rows, used, nominal, eff, Tm };
  },

  /** Calcola il risultato di uno studente. */
  score(t, vId, rec) {
    const M = Calc.matrix(t, vId);
    const C = Calc.closed(t, vId);
    const ex = {}, ind = {};
    M.used.forEach(i => { ind[i.id] = { punti: 0, max: M.eff[i.id], media: null }; });
    let complete = true, manual = 0, filledAny = false;

    M.rows.forEach(r => {
      const ns = !!(rec.nonSvolti && rec.nonSvolti[r.ex.id]);
      let pts = 0, filled = 0, n = 0;
      Object.keys(r.cells).forEach(indId => {
        n++;
        const max = U.num(Calc.indicator(t, indId).max) || 0;
        let s = ns ? 0 : U.num(rec.punteggi && rec.punteggi[r.ex.id] ? rec.punteggi[r.ex.id][indId] : null);
        if (s === null) s = 0; else filled++;
        s = U.clamp(s, 0, max);
        const c = max > 0 ? s / max * r.cells[indId] : 0;
        pts += c;
        ind[indId].punti += c;
      });
      const done = ns || filled === n;
      if (!done) complete = false;
      if (ns || filled) filledAny = true;
      ex[r.ex.id] = { punti: pts, max: r.peso, completo: done, nonSvolto: ns };
      manual += pts;
    });

    M.used.forEach(i => {
      const x = ind[i.id];
      x.media = x.max > 0 ? x.punti / x.max * (U.num(i.max) || 0) : null;
    });

    let closedPts = 0, closedAnswered = 0;
    const cnt = Calc.closedCounts(rec, C);
    if (C.uniform) {
      // tutte le domande a risposta singola valgono uguale: bastano i conteggi
      closedPts = cnt.C * (C.singole.length ? C.singole[0].valore : 0) + cnt.E * (U.num(t.chiuse.errata) || 0) + cnt.N * (U.num(t.chiuse.nonData) || 0);
      closedAnswered = cnt.C + cnt.E + cnt.N;
    } else {
      C.singole.forEach(q => {
        const a = rec.chiuse ? rec.chiuse[q.id] : null;
        if (a === 'C') closedPts += q.valore;
        else if (a === 'E') closedPts += U.num(t.chiuse.errata) || 0;
        else if (a === 'N') closedPts += U.num(t.chiuse.nonData) || 0;
        if (a) closedAnswered++;
      });
    }
    if (C.singole.length && closedAnswered !== C.singole.length) complete = false;
    let partialDone = 0;
    C.composte.forEach(q => {
      const x = Calc.partialValue(rec, q);
      if (x === null) { complete = false; return; }
      closedPts += q.valore * x / q.parti;
      partialDone++;
    });
    if (closedAnswered || partialDone) filledAny = true;
    if (t.chiuse.minimoZero) closedPts = Math.max(0, closedPts);

    const totale = manual + closedPts;
    const maxTot = M.Tm + C.max;
    const voto = Calc.voto(t, totale, maxTot);
    const votoArr = Math.round(voto * 2) / 2;
    return {
      matrix: M, closed: C, esercizi: ex, indicatori: ind,
      manuale: manual, chiuse: closedPts, chiuseConteggi: cnt, totale, max: maxTot,
      voto, votoArr, completo: complete, iniziato: filledAny
    };
  },

  /** Avvisi sulla configurazione di una versione. */
  warnings(t, vId) {
    const w = [];
    const std = Calc.standardWeights(t);
    if (std.biasSum) {
      w.push('Le correzioni sommano ' + (std.biasSum > 0 ? '+' : '') + U.fmt(std.biasSum) + ': le domande da valutare valgono ' + U.fmt(Math.round(std.R) + std.biasSum) +
        ' punti invece di ' + U.fmt(Math.round(std.R)) + ' (somma dei massimi degli indicatori) e il peso degli indicatori cambia di conseguenza.');
    }
    const exs = Calc.exercises(t, vId);
    exs.forEach(e => { if (!Calc.validIndicators(t, e).length) w.push('«' + (e.nome || 'Domanda') + '» non ha indicatori associati.'); });
    t.indicatori.forEach(i => Calc.levelIssues(i.livelli, U.num(i.max) || 0).forEach(x => w.push((i.nome || 'Indicatore') + ': ' + x)));
    if (t.distribuzione === 'bilanciata') {
      const M = Calc.matrix(t, vId);
      const totNom = U.sum(M.used, i => M.nominal[i.id]);
      const off = M.used.filter(i => totNom > 0 && Math.abs(M.eff[i.id] - M.nominal[i.id] * M.Tm / totNom) > 0.05);
      if (off.length) w.push('Con queste domande non è possibile rispettare esattamente il peso di: ' + off.map(i => i.nome).join(', ') + '.');
    }
    return w;
  }
};

if (typeof module !== 'undefined') module.exports = { U, Model, Calc };

/* =====================================================================
 * backend.js — librerie esterne, elenchi classe e file locali (JSON, export)

const Libs = {
  urls: {
    jspdf: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
    autotable: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js',
    exceljs: 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js',
    sheetjs: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
    jszip: 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'
  },
  loaded: {},
  load(name) {
    if (!this.loaded[name]) {
      this.loaded[name] = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = this.urls[name];
        s.onload = resolve;
        s.onerror = () => { delete this.loaded[name]; reject(new Error('Impossibile caricare la libreria ' + name + ' (sei online?)')); };
        document.head.appendChild(s);
      });
    }
    return this.loaded[name];
  },
  async pdf() { await this.load('jspdf'); await this.load('autotable'); return window.jspdf.jsPDF; },
  async excel() { await this.load('exceljs'); return window.ExcelJS; },
  async sheet() { await this.load('sheetjs'); return window.XLSX; },
  async zip() { await this.load('jszip'); return window.JSZip; }
};

/* ---------------------------------------------------------------------
 * Elenchi classe: CSV / XLS(X) / ODS con colonne nome, cognome, BES
 * ------------------------------------------------------------------- */
const ClassList = {
  /** Nome classe dal nome file: "3P.csv" -> "3P". */
  classFromName(name) { return String(name || '').replace(/\.(csv|xlsx?|ods|txt)$/i, '').trim(); },

  parseCSV(text) {
    text = String(text || '').replace(/^﻿/, '');
    const first = text.split(/\r?\n/)[0] || '';
    const counts = { ';': (first.match(/;/g) || []).length, ',': (first.match(/,/g) || []).length, '\t': (first.match(/\t/g) || []).length };
    const sep = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
    const rows = [];
    let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
        else if (c === '"') q = false;
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === sep) { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); rows.push(row); row = []; cell = '';
      } else cell += c;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows;
  },

  async parseFile(file) {
    if (/\.(csv|txt)$/i.test(file.name)) return ClassList.parseCSV(await file.text());
    const XLSX = await Libs.sheet();
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' });
  },

  /** Righe -> [{cognome, nome, bes}]. Riconosce le intestazioni; senza intestazione assume nome, cognome, BES. */
  toStudents(rows) {
    rows = (rows || []).filter(r => r && r.some(c => String(c).trim()));
    if (!rows.length) return [];
    const head = rows[0].map(c => String(c).trim().toLowerCase());
    let iN = head.findIndex(h => h === 'nome' || h === 'name');
    let iC = head.findIndex(h => h === 'cognome' || h === 'surname');
    let iB = head.findIndex(h => h === 'bes' || h.indexOf('bes') === 0 || h === 'tipologia' || h === 'versione');
    let body = rows;
    if (iN >= 0 || iC >= 0) body = rows.slice(1);
    else { iN = 0; iC = 1; iB = 2; }
    return body.map(r => ({
      nome: String(r[iN] || '').trim(),
      cognome: String(r[iC] || '').trim(),
      bes: iB >= 0 ? String(r[iB] || '').trim() : ''
    })).filter(s => s.nome || s.cognome);
  }
};

/* ---------------------------------------------------------------------
 * File locali: download e lettura
 * ------------------------------------------------------------------- */
const Files = {
  download(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  },
  pickFile(accept) {
    return new Promise(resolve => {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = accept || '';
      inp.onchange = () => resolve(inp.files && inp.files[0] ? inp.files[0] : null);
      inp.click();
    });
  }
};

/* =====================================================================
 * exporters.js — griglia (vuota o compilata) in HTML, PDF e XLSX
 * ===================================================================== */

const Grid = {
  /**
   * Struttura comune a tutti gli export.
   * stu: record studente (facoltativo); ctx: { classe, data } per il piè di pagina.
   */
  data(t, vId, stu, ctx) {
    const M = Calc.matrix(t, vId);
    const res = stu ? Calc.score(t, vId, stu) : null;
    const C = Calc.closed(t, vId);
    const indList = M.rows.length ? M.used : t.indicatori;
    const cols = M.rows.map(r => ({
      id: r.ex.id, nome: r.ex.nome, peso: r.peso,
      nonSvolto: res ? res.esercizi[r.ex.id].nonSvolto : false,
      punti: res ? res.esercizi[r.ex.id].punti : null
    }));
    const inds = indList.map(i => ({
      ind: i,
      ranges: Calc.levelRanges(i.livelli, U.num(i.max) || 0),
      cells: M.rows.map(r => {
        if (r.cells[i.id] === undefined) return { v: '-', off: true };
        if (!res) return { v: '' };
        if (res.esercizi[r.ex.id].nonSvolto) return { v: 'N.S.', ns: true };
        const v = U.num(stu.punteggi && stu.punteggi[r.ex.id] ? stu.punteggi[r.ex.id][i.id] : null);
        return { v: v === null ? '' : U.fmt(v) };
      }),
      last: res ? (res.indicatori[i.id] ? U.fmt(res.indicatori[i.id].media) : '') : U.fmt(M.eff[i.id])
    }));
    const showNote = t.notaPiede && (t.notaPiedeQuando === 'sempre' || (t.notaPiedeQuando === 'bes' && vId && vId !== 'std'));
    let closedLine = null;
    if (C.items.length) {
      const parts = [];
      if (!res) {
        if (C.singole.length) {
          const vals = [...new Set(C.singole.map(q => U.fmt(q.valore)))];
          parts.push(C.singole.length + ' domande · corretta: ' + vals.join('/') + ' pt · errata: ' + U.fmt(U.num(t.chiuse.errata) || 0) + ' · non data: ' + U.fmt(U.num(t.chiuse.nonData) || 0));
        }
        if (C.composte.length) {
          parts.push((C.composte.length === 1 ? '1 domanda a risposta multipla (' + C.composte[0].parti + ' parti, ' : C.composte.length + ' domande a risposta multipla (') +
            U.fmt(U.sum(C.composte, q => q.valore)) + ' pt, punteggio proporzionale alle parti corrette)');
        }
        closedLine = { label: 'Domande a risposta chiusa', text: parts.join(' · '), value: U.fmt(C.max) };
      } else {
        if (C.singole.length) {
          const cnt = Calc.closedCounts(stu, C);
          parts.push('Corrette ' + cnt.C + ' · errate ' + cnt.E + ' · non date ' + cnt.N + ' (su ' + C.singole.length + ')');
        }
        C.composte.forEach(q => {
          const x = Calc.partialValue(stu, q);
          parts.push(q.nome + ': ' + (x === null ? '-' : x) + '/' + q.parti + ' parti corrette');
        });
        closedLine = { label: 'Domande a risposta chiusa', text: parts.join(' · '), value: U.fmt(res.chiuse) + ' / ' + U.fmt(C.max) };
      }
    }
    return {
      title: 'GRIGLIA DI VALUTAZIONE' + (Model.templateTitle(t) ? ' — ' + Model.templateTitle(t).toUpperCase() : ''),
      subtitle: t.intestazione || '',
      student: !!stu,
      lastHeader: stu ? 'Media' : 'Peso',
      cols, inds, closedLine,
      totManual: M.Tm,
      res,
      total: res ? U.fmt(res.totale) + ' / ' + U.fmt(res.max) : U.fmt(M.Tm + C.max),
      // voto finale (grande, nell'ultima colonna a destra) e dettaglio del calcolo accanto
      voto: res ? U.fmt(res.votoArr, 1) : '',
      votoDettaglio: res ? 'voto calcolato ' + U.fmtFixed(res.voto, 2) + ', arrotondato al mezzo voto' : Calc.votoRule(t, M.Tm + C.max),
      note: showNote ? t.notaPiede : '',
      info: stu ? [['Alunno', U.studentName(stu)], ['Classe', (ctx && ctx.classe) || ''], ['Data', U.dateIT(stu.data || (ctx && ctx.data))]] : null
    };
  },

  css: `
.gv-grid{border-collapse:collapse;width:100%;font:12px/1.3 "Segoe UI",Arial,sans-serif;color:#111;background:#fff}
.gv-grid th,.gv-grid td{border:1px solid #555;padding:4px 5px;vertical-align:middle}
.gv-grid thead th{background:#dfe7f3;font-weight:600;text-align:center}
.gv-grid .gv-title{background:#c9d6ea;font-size:14px;font-weight:700;text-align:center}
.gv-grid .gv-sub{background:#eef2f8;text-align:center;font-weight:500}
.gv-grid .gv-ind{font-weight:600;background:#f6f8fb}
.gv-grid .c{text-align:center}
.gv-grid .gv-desc{font-size:11px;white-space:pre-line}
.gv-grid .gv-off{background:#e6e6e6;color:#777;text-align:center}
.gv-grid .gv-ns{background:#fdecea;text-align:center;color:#a33}
.gv-grid .gv-foot td{background:#f6f8fb;font-weight:600}
.gv-grid .gv-total td{background:#dfe7f3;font-weight:700}
.gv-grid .gv-voto td{border:2px solid #1f3d73}
.gv-grid .gv-voto-label{text-align:right;font-size:16px;font-weight:800;letter-spacing:.06em;background:#dfe7f3}
.gv-grid .gv-voto-det{font-size:11px;font-weight:400;letter-spacing:0;color:#444;margin-right:14px}
.gv-grid .gv-voto-val{text-align:center;font-size:28px;font-weight:800;min-width:64px;height:44px;background:#1f3d73;color:#fff}
.gv-grid .gv-note{font-style:italic;font-size:11px;border:none;padding-top:8px}
.gv-info{margin-top:10px;font:13px "Segoe UI",Arial,sans-serif;display:flex;gap:28px}
.gv-info b{font-weight:600}
`,

  html(d) {
    const e = U.esc;
    const n = d.cols.length;
    const width = 6 + n;
    let h = '<table class="gv-grid"><thead>';
    h += '<tr><th class="gv-title" colspan="' + width + '">' + e(d.title) + '</th></tr>';
    if (d.subtitle) h += '<tr><th class="gv-sub" colspan="' + width + '">' + e(d.subtitle) + '</th></tr>';
    h += '<tr><th>Indicatore</th><th>Punti</th><th colspan="2">Descrittori</th><th>Punteggio</th>';
    d.cols.forEach(c => { h += '<th>' + e(c.nome) + '</th>'; });
    h += '<th>' + e(d.lastHeader) + '</th></tr></thead><tbody>';
    d.inds.forEach(row => {
      const rs = row.ranges.length;
      row.ranges.forEach((r, k) => {
        h += '<tr>';
        if (k === 0) h += '<td class="gv-ind" rowspan="' + rs + '">' + e(row.ind.nome) + '</td><td class="c" rowspan="' + rs + '">' + e(U.fmt(U.num(row.ind.max))) + '</td>';
        h += '<td class="c">' + e(r.level.nome) + '</td><td class="gv-desc">' + e(r.level.descrittore || '') + '</td>';
        h += '<td class="c">' + Calc.rangeLabel(r) + '</td>';
        if (k === 0) {
          row.cells.forEach(c => { h += '<td rowspan="' + rs + '" class="' + (c.off ? 'gv-off' : c.ns ? 'gv-ns' : 'c') + '">' + e(c.v) + '</td>'; });
          h += '<td class="c" rowspan="' + rs + '">' + e(row.last) + '</td>';
        }
        h += '</tr>';
      });
    });
    const foot = (label, vals, last, cls) => {
      let s = '<tr class="' + (cls || 'gv-foot') + '"><td colspan="5">' + e(label) + '</td>';
      vals.forEach(v => { s += '<td class="c">' + e(v) + '</td>'; });
      return s + '<td class="c">' + e(last) + '</td></tr>';
    };
    h += foot(d.student ? 'Punteggio massimo domanda' : 'Punteggio domanda', d.cols.map(c => U.fmt(c.peso)), U.fmt(d.totManual));
    if (d.student) h += foot('Punteggio ottenuto', d.cols.map(c => c.nonSvolto ? 'N.S.' : U.fmt(c.punti)), U.fmt(d.res.manuale));
    if (d.closedLine) h += '<tr class="gv-foot"><td colspan="5">' + e(d.closedLine.label) + '</td><td colspan="' + n + '">' + e(d.closedLine.text) + '</td><td class="c">' + e(d.closedLine.value) + '</td></tr>';
    h += '<tr class="gv-total"><td colspan="5">PUNTEGGIO TOTALE</td><td colspan="' + n + '"></td><td class="c">' + e(d.total) + '</td></tr>';
    h += '<tr class="gv-voto"><td colspan="' + (5 + n) + '" class="gv-voto-label"><span class="gv-voto-det">' + e(d.votoDettaglio) + '</span>VOTO</td>' +
      '<td class="gv-voto-val">' + e(d.voto) + '</td></tr>';
    if (d.note) h += '<tr><td class="gv-note" colspan="' + width + '">' + e(d.note) + '</td></tr>';
    h += '</tbody></table>';
    if (d.info) h += '<div class="gv-info">' + d.info.map(([k, v]) => '<div><b>' + e(k) + ':</b> ' + e(v) + '</div>').join('') + '</div>';
    return h;
  },

  htmlDocument(title, bodies) {
    return '<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>' + U.esc(title) +
      '</title><style>body{margin:16px;background:#fff}.gv-page{page-break-after:always;margin-bottom:32px}@page{size:A4 landscape;margin:10mm}' + Grid.css + '</style></head><body>' +
      bodies.map(b => '<div class="gv-page">' + b + '</div>').join('') + '</body></html>';
  },

  /* ---------------- PDF ---------------- */
  async pdf(list) {
    const jsPDF = await Libs.pdf();
    const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    // ogni griglia deve stare in una pagina: se sfora, si riprova con caratteri più piccoli
    const sizes = [7, 6.5, 6, 5.5, 5];
    list.forEach((d, idx) => {
      if (idx) doc.addPage();
      const start = doc.getNumberOfPages();
      for (let k = 0; k < sizes.length; k++) {
        const fits = Grid._pdfPage(doc, d, sizes[k]);
        if ((fits && doc.getNumberOfPages() === start) || k === sizes.length - 1) break;
        for (let p = doc.getNumberOfPages(); p >= start; p--) doc.deletePage(p);
        doc.addPage();
      }
    });
    return doc.output('blob');
  },

  _pdfPage(doc, d, fs) {
    fs = fs || 7;
    const pad = fs >= 7 ? 1.2 : fs >= 6 ? 0.9 : 0.7;
    const n = d.cols.length;
    const W = 297 - 16;
    const fixed = 30 + 11 + 22 + 18 + 15;
    const exW = U.clamp((W - fixed - 60) / Math.max(n, 1), 7, 12);
    const descW = W - fixed - exW * n;
    const head = [[
      { content: 'Indicatore' }, { content: 'Punti' }, { content: 'Descrittori', colSpan: 2 }, { content: 'Punteggio' },
      ...d.cols.map(c => ({ content: c.nome })), { content: d.lastHeader }
    ]];
    const grey = [230, 230, 230], pale = [246, 248, 251], blue = [223, 231, 243], pink = [253, 236, 234];
    const body = [];
    d.inds.forEach(row => {
      const rs = row.ranges.length;
      row.ranges.forEach((r, k) => {
        const line = [];
        if (k === 0) {
          line.push({ content: row.ind.nome, rowSpan: rs, styles: { fontStyle: 'bold', fillColor: pale, valign: 'middle' } });
          line.push({ content: U.fmt(U.num(row.ind.max)), rowSpan: rs, styles: { halign: 'center', valign: 'middle' } });
        }
        line.push({ content: r.level.nome, styles: { halign: 'center', valign: 'middle' } });
        line.push({ content: r.level.descrittore || '', styles: { fontSize: fs - 0.5 } });
        line.push({ content: Calc.rangeLabel(r), styles: { halign: 'center', valign: 'middle' } });
        if (k === 0) {
          row.cells.forEach(c => line.push({ content: c.v, rowSpan: rs, styles: { halign: 'center', valign: 'middle', fillColor: c.off ? grey : c.ns ? pink : false } }));
          line.push({ content: row.last, rowSpan: rs, styles: { halign: 'center', valign: 'middle' } });
        }
        body.push(line);
      });
    });
    const foot = (label, vals, last, fill) => [
      { content: label, colSpan: 5, styles: { fontStyle: 'bold', fillColor: fill || pale } },
      ...vals.map(v => ({ content: v, styles: { halign: 'center', fontStyle: 'bold', fillColor: fill || pale } })),
      { content: last, styles: { halign: 'center', fontStyle: 'bold', fillColor: fill || pale } }
    ];
    body.push(foot(d.student ? 'Punteggio massimo domanda' : 'Punteggio domanda', d.cols.map(c => U.fmt(c.peso)), U.fmt(d.totManual)));
    if (d.student) body.push(foot('Punteggio ottenuto', d.cols.map(c => c.nonSvolto ? 'N.S.' : U.fmt(c.punti)), U.fmt(d.res.manuale)));
    if (d.closedLine) body.push([
      { content: d.closedLine.label, colSpan: 5, styles: { fontStyle: 'bold', fillColor: pale } },
      { content: d.closedLine.text, colSpan: n, styles: { fillColor: pale } },
      { content: d.closedLine.value, styles: { halign: 'center', fontStyle: 'bold', fillColor: pale } }
    ]);
    body.push([
      { content: 'PUNTEGGIO TOTALE', colSpan: 5 + n, styles: { fontStyle: 'bold', fillColor: blue } },
      { content: d.total, styles: { halign: 'center', fontStyle: 'bold', fillColor: blue } }
    ]);
    body.push([
      { content: d.votoDettaglio + '      VOTO', colSpan: 5 + n, styles: { halign: 'right', valign: 'middle', fontStyle: 'bold', fontSize: fs + 4, fillColor: blue, minCellHeight: 13 } },
      { content: d.voto, styles: { halign: 'center', valign: 'middle', fontStyle: 'bold', fontSize: 20, fillColor: [31, 61, 115], textColor: [255, 255, 255], lineWidth: 0.6, lineColor: [31, 61, 115] } }
    ]);

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.text(d.title, 148.5, 11, { align: 'center' });
    let startY = 14;
    if (d.subtitle) {
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
      doc.text(d.subtitle, 148.5, 16, { align: 'center' });
      startY = 19;
    }
    const colStyles = { 0: { cellWidth: 30 }, 1: { cellWidth: 11 }, 2: { cellWidth: 22 }, 3: { cellWidth: descW }, 4: { cellWidth: 18 } };
    for (let i = 0; i < n; i++) colStyles[5 + i] = { cellWidth: exW };
    colStyles[5 + n] = { cellWidth: 15 };
    doc.autoTable({
      head, body, startY,
      margin: { left: 8, right: 8, top: 10, bottom: 10 },
      theme: 'grid',
      rowPageBreak: 'avoid',
      styles: { font: 'helvetica', fontSize: fs, cellPadding: pad, lineColor: [90, 90, 90], lineWidth: 0.2, textColor: [17, 17, 17], overflow: 'linebreak' },
      headStyles: { fillColor: blue, textColor: [17, 17, 17], halign: 'center', fontStyle: 'bold' },
      columnStyles: colStyles
    });
    let y = doc.lastAutoTable.finalY + 5;
    const fits = y + (d.note ? 6 : 0) + (d.info ? 4 : 0) <= 204;
    doc.setFontSize(8);
    if (d.note) {
      doc.setFont('helvetica', 'italic');
      doc.text(d.note, 8, y); y += 6;
    }
    if (d.info) {
      doc.setFontSize(10);
      let x = 8;
      d.info.forEach(([k, v]) => {
        doc.setFont('helvetica', 'bold'); doc.text(k + ':', x, y);
        const kw = doc.getTextWidth(k + ': ');
        doc.setFont('helvetica', 'normal'); doc.text(v || '', x + kw, y);
        x += kw + Math.max(doc.getTextWidth(v || ''), 20) + 14;
      });
    }
    return fits;
  },

  /* ---------------- XLSX ---------------- */
  sheetName(name, used) {
    let base = String(name || 'Foglio').replace(/[\[\]:*?\/\\]/g, ' ').trim().slice(0, 31) || 'Foglio';
    let s = base, k = 2;
    while (used.has(s.toLowerCase())) { const suf = ' (' + k++ + ')'; s = base.slice(0, 31 - suf.length) + suf; }
    used.add(s.toLowerCase());
    return s;
  },

  xlsxSheet(wb, name, d) {
    const ws = wb.addWorksheet(name, { pageSetup: { orientation: 'landscape', paperSize: 9, fitToPage: true, fitToWidth: 1, fitToHeight: 0 } });
    const n = d.cols.length;
    const lastCol = 6 + n;
    const thin = { style: 'thin', color: { argb: 'FF555555' } };
    const border = { top: thin, left: thin, bottom: thin, right: thin };
    const fill = argb => ({ type: 'pattern', pattern: 'solid', fgColor: { argb } });
    const BLUE = 'FFDFE7F3', PALE = 'FFF6F8FB', GREY = 'FFE6E6E6', PINK = 'FFFDECEA', TITLE = 'FFC9D6EA';
    const set = (r, c, v, st) => {
      const cell = ws.getCell(r, c);
      cell.value = v;
      cell.border = border;
      cell.alignment = Object.assign({ vertical: 'middle', wrapText: true }, (st && st.align) || {});
      if (st && st.fill) cell.fill = fill(st.fill);
      if (st && st.bold) cell.font = { bold: true, size: st.size || 10 };
      else if (st && st.size) cell.font = { size: st.size };
      return cell;
    };
    const center = { horizontal: 'center' };
    const numOrText = v => { const x = U.num(v); return x === null || String(v).indexOf('/') >= 0 ? v : x; };

    ws.columns = [{ width: 24 }, { width: 8 }, { width: 10 }, { width: 62 }, { width: 11 }, ...d.cols.map(() => ({ width: 7.5 })), { width: 11 }];
    let r = 1;
    ws.mergeCells(r, 1, r, lastCol); set(r, 1, d.title, { bold: true, size: 12, fill: TITLE, align: center }); r++;
    if (d.subtitle) { ws.mergeCells(r, 1, r, lastCol); set(r, 1, d.subtitle, { align: center, fill: PALE }); r++; }
    ['Indicatore', 'Punti', 'Descrittori', '', 'Punteggio'].forEach((h, i) => set(r, i + 1, h, { bold: true, fill: BLUE, align: center }));
    ws.mergeCells(r, 3, r, 4);
    d.cols.forEach((c, i) => set(r, 6 + i, c.nome, { bold: true, fill: BLUE, align: center }));
    set(r, lastCol, d.lastHeader, { bold: true, fill: BLUE, align: center });
    r++;

    d.inds.forEach(row => {
      const rs = row.ranges.length;
      const r0 = r;
      row.ranges.forEach((lv, k) => {
        set(r + k, 1, k === 0 ? row.ind.nome : null, { bold: true, fill: PALE });
        set(r + k, 2, k === 0 ? U.num(row.ind.max) : null, { align: center });
        set(r + k, 3, lv.level.nome, { align: center });
        set(r + k, 4, lv.level.descrittore || '', { size: 9 });
        set(r + k, 5, Calc.rangeLabel(lv), { align: center });
        row.cells.forEach((c, i) => set(r + k, 6 + i, k === 0 ? numOrText(c.v) : null, { align: center, fill: c.off ? GREY : c.ns ? PINK : null }));
        set(r + k, lastCol, k === 0 ? numOrText(row.last) : null, { align: center });
      });
      if (rs > 1) {
        [1, 2].concat(d.cols.map((_, i) => 6 + i), [lastCol]).forEach(c => ws.mergeCells(r0, c, r0 + rs - 1, c));
      }
      r += rs;
    });

    const footRow = (label, vals, last, f) => {
      ws.mergeCells(r, 1, r, 5);
      set(r, 1, label, { bold: true, fill: f || PALE });
      for (let c = 2; c <= 5; c++) set(r, c, null, { fill: f || PALE });
      vals.forEach((v, i) => set(r, 6 + i, numOrText(v), { bold: true, fill: f || PALE, align: center }));
      set(r, lastCol, numOrText(last), { bold: true, fill: f || PALE, align: center });
      r++;
    };
    footRow(d.student ? 'Punteggio massimo domanda' : 'Punteggio domanda', d.cols.map(c => U.fmt(c.peso)), U.fmt(d.totManual));
    if (d.student) footRow('Punteggio ottenuto', d.cols.map(c => c.nonSvolto ? 'N.S.' : U.fmt(c.punti)), U.fmt(d.res.manuale));
    const spanRow = (label, text, last, f) => {
      ws.mergeCells(r, 1, r, 5); set(r, 1, label, { bold: true, fill: f });
      for (let c = 2; c <= 5; c++) set(r, c, null, { fill: f });
      if (last === undefined) {
        ws.mergeCells(r, 6, r, lastCol); set(r, 6, text, { bold: true, fill: f, align: center });
        for (let c = 7; c <= lastCol; c++) set(r, c, null, { fill: f });
      } else {
        if (n > 1) ws.mergeCells(r, 6, r, 5 + n);
        set(r, 6, text, { fill: f });
        for (let c = 7; c <= 5 + n; c++) set(r, c, null, { fill: f });
        set(r, lastCol, last, { bold: true, fill: f, align: center });
      }
      r++;
    };
    if (d.closedLine) spanRow(d.closedLine.label, d.closedLine.text, d.closedLine.value, PALE);
    spanRow('PUNTEGGIO TOTALE', '', d.total, BLUE);
    // voto finale: etichetta allineata a destra e valore grande nell'ultima colonna
    ws.mergeCells(r, 1, r, lastCol - 1);
    const vl = set(r, 1, d.votoDettaglio + '      VOTO', { fill: BLUE, align: { horizontal: 'right' } });
    vl.font = { bold: true, size: 14 };
    for (let c = 2; c < lastCol; c++) set(r, c, null, { fill: BLUE });
    const vv = set(r, lastCol, numOrText(d.voto), { fill: 'FF1F3D73', align: center });
    vv.font = { bold: true, size: 22, color: { argb: 'FFFFFFFF' } };
    ws.getRow(r).height = 34;
    r++;
    if (d.note) { r++; ws.mergeCells(r, 1, r, lastCol); ws.getCell(r, 1).value = d.note; ws.getCell(r, 1).font = { italic: true, size: 9 }; r++; }
    if (d.info) {
      r++;
      d.info.forEach(([k, v]) => {
        ws.getCell(r, 1).value = k; ws.getCell(r, 1).font = { bold: true };
        ws.mergeCells(r, 2, r, 4); ws.getCell(r, 2).value = v;
        r++;
      });
    }
    return ws;
  },

  async xlsxBlob(build) {
    const ExcelJS = await Libs.excel();
    const wb = new ExcelJS.Workbook();
    wb.creator = 'Griglie di valutazione';
    build(wb);
    const buf = await wb.xlsx.writeBuffer();
    return new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }
};

/* ---------------------------------------------------------------------
 * Riepilogo della classe
 * ------------------------------------------------------------------- */
const Summary = {
  /** Tutti gli esercizi che compaiono in almeno una versione usata. */
  columns(s) {
    const t = s.template;
    const seen = new Map();
    t.esercizi.forEach(e => seen.set(e.id, e.nome));
    t.versioni.forEach(v => v.aggiunti.forEach(e => { if (s.studenti.some(st => st.versione === v.id)) seen.set(e.id, e.nome + ' (' + v.nome + ')'); }));
    return [...seen.entries()].map(([id, nome]) => ({ id, nome }));
  },

  rows(s) {
    const t = s.template;
    return [...s.studenti].sort(U.compareStudents).map(st => {
      if (st.assente) return { st, assente: true };
      return { st, res: Calc.score(t, st.versione, st) };
    });
  },

  async xlsx(s, withStudents) {
    const t = s.template;
    const cols = Summary.columns(s);
    const rows = Summary.rows(s);
    const hasClosed = !!t.chiuse.attive;
    return Grid.xlsxBlob(wb => {
      const used = new Set();
      const ws = wb.addWorksheet(Grid.sheetName('Riepilogo', used));
      const header = ['Cognome', 'Nome', 'Data', 'Versione', ...cols.map(c => c.nome)];
      if (hasClosed) header.push('Domande chiuse');
      header.push('Punteggio', 'Su', 'Voto', 'Voto arrotondato', 'Stato');
      ws.addRow([Model.templateTitle(t) + ' — classe ' + (s.classe || '')]).font = { bold: true, size: 12 };
      const hr = ws.addRow(header);
      hr.font = { bold: true };
      hr.eachCell(c => { c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFDFE7F3' } }; });
      rows.forEach(({ st, res, assente }) => {
        const line = [st.cognome, st.nome, U.dateIT(st.data || s.data), Model.versionName(t, st.versione)];
        if (assente) {
          cols.forEach(() => line.push(''));
          if (hasClosed) line.push('');
          line.push('', '', '', '', 'Assente');
        } else {
          cols.forEach(c => {
            const x = res.esercizi[c.id];
            line.push(!x ? '-' : x.nonSvolto ? 'N.S.' : U.round(x.punti, 2));
          });
          if (hasClosed) line.push(U.round(res.chiuse, 2));
          line.push(U.round(res.totale, 2), U.round(res.max, 2), U.round(res.voto, 2), res.votoArr, res.completo ? 'Completa' : 'Incompleta');
        }
        ws.addRow(line);
      });
      ws.columns.forEach((c, i) => { c.width = i < 2 ? 18 : i < 4 ? 12 : 10; });
      ws.views = [{ state: 'frozen', xSplit: 2, ySplit: 2 }];
      if (withStudents) {
        rows.filter(r => !r.assente).forEach(({ st }) => {
          Grid.xlsxSheet(wb, Grid.sheetName(U.studentName(st), used), Grid.data(t, st.versione, st, s));
        });
      }
    });
  }
};
