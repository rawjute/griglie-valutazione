const { render, useState, useEffect, useRef, useMemo } = htmPreact;

/**
 * html`` di htm, con un controllo: se in posizione di tag arriva qualcosa che non è un
 * componente (funzione) o un nome di tag, l'errore dice quale modello e quale valore,
 * invece del generico "createElement: tag name ''" di Preact.
 */
const _checkedTemplates = new WeakSet();
function html(strings) {
  if (!_checkedTemplates.has(strings)) {
    _checkedTemplates.add(strings);
    // un "<" che non apre un tag (né un componente interpolato) farebbe creare a htm un elemento senza nome
    strings.forEach((s, i) => {
      const re = /<(?=[^a-zA-Z\/])/g;
      let m;
      while ((m = re.exec(s))) {
        throw new Error('Modello alterato: carattere «<» fuori posto in «' + s.slice(Math.max(0, m.index - 50), m.index + 40).replace(/\s+/g, ' ') + '»');
      }
      if (i < strings.length - 1 && /<\s+$/.test(s)) throw new Error('Modello alterato vicino a «' + s.slice(-50) + '»');
    });
  }
  for (let i = 1; i < arguments.length; i++) {
    const v = arguments[i];
    if (/<\/?$/.test(strings[i - 1]) && (typeof v !== 'function' && (typeof v !== 'string' || !v))) {
      throw new Error('Componente non valido (' + (v === '' ? 'stringa vuota' : Object.prototype.toString.call(v)) + ') nel modello: «' +
        strings[i - 1].replace(/\s+/g, ' ').slice(-80) + '…' + String(strings[i] || '').replace(/\s+/g, ' ').slice(0, 60) + '»');
    }
  }
  return htmPreact.html.apply(null, arguments);
}

const S = {
  view: 'home',
  // verifica in modifica
  tpl: null, tplDirty: false, builderTab: 'generale', editVersion: null, previewVersion: 'std',
  // sessione di valutazione (sesRev / savedRev: modifiche fatte / modifiche già scaricate in JSON)
  ses: null, sesRev: 0, savedRev: 0, saveState: 'idle', sesTab: 'classe', cur: null,
  returnToSession: false, // la verifica è stata aperta dalla valutazione: l'editor offre il ritorno
  busy: null, toast: null, dialog: null
};

let _bump = () => {};
function refresh() { _bump(); }

/* ---------------- bozza locale (recupero in caso di chiusura) ---------------- */
const Draft = {
  KEY: 'gv_draft_v1',
  timer: null,
  save() {
    clearTimeout(this.timer);
    this.timer = setTimeout(() => {
      try {
        localStorage.setItem(this.KEY, JSON.stringify({
          savedAt: new Date().toISOString(),
          tpl: S.tplDirty ? S.tpl : null,
          ses: S.ses && S.sesRev !== S.savedRev ? S.ses : null
        }));
      } catch (e) { /* spazio esaurito o storage bloccato: si ignora */ }
      if (S.view === 'home') refresh();
    }, 400);
  },
  read() { try { const d = JSON.parse(localStorage.getItem(this.KEY) || 'null'); return d && (d.tpl || d.ses) ? d : null; } catch (e) { return null; } },
  clear() { try { localStorage.removeItem(this.KEY); } catch (e) { /* ignora */ } }
};

/* ---------------- notifiche ---------------- */
let _toastTimer = null;
function toast(msg, kind) {
  S.toast = { msg, kind: kind || 'ok' };
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { S.toast = null; refresh(); }, kind === 'error' ? 7000 : 3500);
  refresh();
}

/** Conferma dentro la pagina (window.confirm() in alcuni contesti viene bloccato). */
function ask(msg, okLabel, danger) {
  return new Promise(resolve => {
    S.dialog = { msg, okLabel: okLabel || 'Conferma', danger: !!danger, resolve };
    refresh();
  });
}

function closeDialog(answer) {
  const d = S.dialog;
  S.dialog = null;
  refresh();
  if (d) d.resolve(answer);
}

function Dialog() {
  const d = S.dialog;
  const okRef = useRef(null);
  useEffect(() => { if (okRef.current) okRef.current.focus(); }, [d]);
  if (!d) return null;
  return html`<div class="modal-back" onClick=${e => { if (e.target === e.currentTarget) closeDialog(false); }}
    onKeyDown=${e => { if (e.key === 'Escape') closeDialog(false); }}>
    <div class="modal" role="dialog" aria-modal="true">
      <p>${d.msg}</p>
      <div class="row gap end-row">
        <button class="btn" onClick=${() => closeDialog(false)}>Annulla</button>
        <button ref=${okRef} class=${'btn ' + (d.danger ? 'danger-solid' : 'primary')} onClick=${() => closeDialog(true)}>${d.okLabel}</button>
      </div>
    </div>
  </div>`;
}

async function withBusy(label, fn) {
  S.busy = label; refresh();
  try { return await fn(); }
  catch (e) { console.error(e); toast(e.message || String(e), 'error'); }
  finally { S.busy = null; refresh(); }
}

/* ---------------- modifiche ---------------- */
function changedTpl() {
  Model.renumber(S.tpl); // DV / DS / DM sempre in sequenza dopo aggiunte, eliminazioni e spostamenti
  S.tplDirty = true;
  S.tpl.modificato = new Date().toISOString();
  Draft.save();
  refresh();
}

function changedSes() {
  S.sesRev++;
  S.ses.modificato = new Date().toISOString();
  S.saveState = 'pending';
  Draft.save();
  refresh();
}

/* ---------------- salvataggio: file JSON scaricati ---------------- */
function saveTemplate() {
  exportJSON(S.tpl, Model.templateFileName(S.tpl));
  S.tplDirty = false; Draft.save();
  toast('File JSON della verifica scaricato');
}

function saveSession() {
  if (!S.ses) return;
  exportJSON(S.ses, Model.sessionFileName(S.ses));
  S.savedRev = S.sesRev; S.saveState = 'saved'; Draft.save();
  toast('File JSON della valutazione scaricato');
}

function exportJSON(obj, name) {
  Files.download(new Blob([JSON.stringify(obj, null, 1)], { type: 'application/json' }), name);
}

async function importJSONFile() {
  const f = await Files.pickFile('.json,application/json');
  if (!f) return null;
  try { return JSON.parse(await f.text()); }
  catch (e) { toast('Il file non è un JSON valido', 'error'); return null; }
}

/** Apre una verifica; fromFile: appena letta da un JSON (quindi senza modifiche da salvare). */
function openTemplateObj(obj, fromFile) {
  S.tpl = Model.normalizeTemplate(obj);
  S.tplDirty = !fromFile;
  S.builderTab = 'generale';
  S.editVersion = null;
  S.previewVersion = 'std';
  S.view = 'builder';
  refresh();
}

/** Apre una valutazione; fromFile: appena letta da un JSON. */
function openSessionObj(obj, fromFile) {
  S.ses = Model.normalizeSession(obj);
  S.sesRev = fromFile ? 0 : 1;
  S.savedRev = 0;
  S.saveState = fromFile ? 'saved' : 'pending';
  S.sesTab = S.ses.studenti.length ? 'correzione' : 'classe';
  S.cur = S.ses.studenti.length ? [...S.ses.studenti].sort(U.compareStudents)[0].id : null;
  S.view = 'session';
  refresh();
}

function startSession(tplObj) {
  const ses = Model.newSession(Model.normalizeTemplate(tplObj), null);
  openSessionObj(ses, false);
  S.sesTab = 'classe';
  refresh();
}

/**
 * Sostituisce la verifica di una valutazione (i punteggi già inseriti restano, perché sono
 * legati agli identificativi di domande e indicatori). Gli studenti assegnati a una versione
 * che non esiste più tornano alla versione indicata dal loro BES.
 */
function applyTemplateToSession(s, tplObj) {
  s.template = Model.normalizeTemplate(U.clone(tplObj));
  s.studenti.forEach(st => {
    if (st.versione !== 'std' && !s.template.versioni.find(v => v.id === st.versione)) st.versione = Model.versionForBes(s.template, st.bes);
  });
  changedSes();
}

/** Dalla valutazione: apre la sua verifica nell'editor, con il ritorno alla valutazione. */
function editSessionTemplate() {
  openTemplateObj(U.clone(S.ses.template), true);
  S.returnToSession = true;
  refresh();
}

/** Dall'editor: applica le modifiche alla valutazione aperta e torna alla correzione. */
function backToSession(apply) {
  if (apply) applyTemplateToSession(S.ses, S.tpl);
  S.returnToSession = false;
  S.view = 'session';
  refresh();
  if (apply) toast('Verifica aggiornata nella valutazione');
}

/** Scarica un file di export. */
function deliver(blob, name) {
  Files.download(blob, name);
}

async function leaveTo(view) {
  if (S.view === 'builder' && S.tplDirty && !(await ask('Ci sono modifiche alla verifica non scaricate in JSON. Uscire comunque? (Resta una bozza nel browser.)', 'Esci'))) return;
  if (S.view === 'session' && S.sesRev !== S.savedRev && !(await ask('La valutazione ha modifiche non scaricate in JSON. Uscire comunque? (Resta una bozza nel browser.)', 'Esci'))) return;
  S.view = view;
  S.returnToSession = false;
  refresh();
}

/* ---------------- componenti base ---------------- */

/** Campo numerico che accetta la virgola e non perde il cursore mentre si scrive. */
function NumInput(p) {
  const show = v => (v === null || v === undefined || v === '') ? '' : U.fmt(U.num(v), 4);
  const [txt, setTxt] = useState(show(p.value));
  const focused = useRef(false);
  useEffect(() => { if (!focused.current) setTxt(show(p.value)); }, [p.value]);
  const n = U.num(txt);
  const invalid = txt.trim() !== '' && (n === null || (p.min !== undefined && n < p.min) || (p.max !== undefined && n > p.max));
  return html`<input
    class=${'num ' + (invalid ? 'invalid ' : '') + (p.class || '')}
    inputmode="decimal" autocomplete="off"
    value=${txt} title=${p.title || ''}
    disabled=${p.disabled} data-nav=${p.nav} data-r=${p.row} data-c=${p.col}
    style=${p.width ? 'width:' + p.width : ''}
    onFocus=${e => { focused.current = true; e.target.select(); if (p.onFocus) p.onFocus(); }}
    onBlur=${() => { focused.current = false; setTxt(show(p.value)); if (p.onBlur) p.onBlur(); }}
    onInput=${e => {
      const t = e.target.value; setTxt(t);
      const x = U.num(t);
      if (t.trim() === '') p.onChange(p.allowEmpty === false ? 0 : null);
      else if (x !== null) p.onChange(x);
    }}
    onKeyDown=${p.onKeyDown} />`;
}

function Field(p) {
  return html`<label class=${'field ' + (p.class || '')}>
    <span class="field-label">${p.label}</span>
    ${p.children}
    ${p.hint && html`<span class="hint">${p.hint}</span>`}
  </label>`;
}

function TextInput(p) {
  return html`<input type="text" class=${p.class || ''} value=${p.value || ''}
    onInput=${e => p.onInput(e.target.value)} style=${p.width ? 'width:' + p.width : ''} />`;
}

function TextArea(p) {
  return html`<textarea class=${p.class || ''} rows=${p.rows || 2} value=${p.value || ''}
    onInput=${e => p.onInput(e.target.value)}></textarea>`;
}

function Tabs(p) {
  return html`<nav class="tabs">${p.items.map(it => html`
    <button class=${'tab ' + (p.value === it.id ? 'active' : '')} onClick=${() => p.onChange(it.id)}>
      ${it.label}${it.badge ? html`<span class=${'badge ' + (it.badgeKind || '')}>${it.badge}</span>` : null}
    </button>`)}</nav>`;
}

function Warnings(p) {
  if (!p.list || !p.list.length) return null;
  return html`<div class="alert warn">${p.list.map(w => html`<div>⚠ ${w}</div>`)}</div>`;
}

function IconBtn(p) {
  return html`<button class=${'icon-btn ' + (p.class || '')} title=${p.title} disabled=${p.disabled} onClick=${p.onClick}>${p.icon}</button>`;
}

function moveItem(arr, i, d) {
  const j = i + d;
  if (j < 0 || j >= arr.length) return;
  const x = arr[i]; arr[i] = arr[j]; arr[j] = x;
}

/* =====================================================================
 * ui-builder.js — creazione / modifica della verifica
 * ===================================================================== */

function Builder() {
  const t = S.tpl;
  const stdWarn = Calc.warnings(t, 'std');
  const tabs = [
    { id: 'generale', label: 'Dati generali' },
    { id: 'livelli', label: 'Livelli predefiniti' },
    { id: 'indicatori', label: 'Indicatori', badge: t.indicatori.length || null },
    { id: 'esercizi', label: 'Domande da valutare', badge: t.esercizi.length || null, badgeKind: stdWarn.length ? 'warn' : '' },
    { id: 'chiuse', label: 'Domande chiuse', badge: t.chiuse.attive ? Calc.closed(t, 'std').items.length : null },
    { id: 'versioni', label: 'Versioni', badge: t.versioni.length || null },
    { id: 'griglia', label: 'Griglia ed export' }
  ];
  const body = {
    generale: BGenerale, livelli: BLivelli, indicatori: BIndicatori, esercizi: BEsercizi,
    chiuse: BChiuse, versioni: BVersioni, griglia: BGriglia
  }[S.builderTab];
  return html`<div class="page">
    <div class="page-head">
      <div>
        <div class="eyebrow">${S.returnToSession ? 'Modifica della verifica della valutazione' + (S.ses && S.ses.classe ? ' · classe ' + S.ses.classe : '') : 'Creazione verifica'}</div>
        <h1>${Model.templateTitle(t)}</h1>
        <div class=${'small ' + (S.tplDirty ? 'save-pending' : 'muted')}>${S.tplDirty ? 'Modifiche non ancora scaricate in JSON' : 'Salvata (JSON scaricato)'}</div>
      </div>
      ${S.returnToSession ? html`<div class="actions">
        <button class="btn primary" title="I punteggi già inseriti restano" onClick=${() => backToSession(true)}>Applica alla valutazione e torna</button>
        <button class="btn" onClick=${saveTemplate}>Scarica JSON della verifica</button>
        <button class="btn" onClick=${async () => {
          if (S.tplDirty && !(await ask('Tornare alla valutazione senza applicare le modifiche alla verifica?', 'Torna senza applicare'))) return;
          backToSession(false);
        }}>Annulla</button>
      </div>` : html`<div class="actions">
        <button class="btn primary" onClick=${saveTemplate}>Salva (scarica JSON)</button>
        <button class="btn" onClick=${async () => {
          if (S.tplDirty && !(await ask('La verifica ha modifiche non salvate. La valutazione userà la versione attuale. Continuare?', 'Continua'))) return;
          startSession(U.clone(t));
        }}>Valuta una classe →</button>
      </div>`}
    </div>
    <${Tabs} items=${tabs} value=${S.builderTab} onChange=${v => { S.builderTab = v; refresh(); }} />
    <div class="panel"><${body} t=${t} /></div>
  </div>`;
}

/* ---------------- Dati generali ---------------- */

  return html`
    <div class="grid2">
      <${Field} label="Materia"><${TextInput} value=${t.materia} onInput=${v => set('materia', v)} /><//>
      <${Field} label="Argomento"><${TextInput} value=${t.argomento} onInput=${v => set('argomento', v)} /><//>
    </div>
    <${Field} label="Intestazione (facoltativa)" hint="Seconda riga della griglia, es. il dipartimento o la scuola.">
      <${TextInput} value=${t.intestazione} onInput=${v => set('intestazione', v)} />
    <//>
    <${Field} label="Descrizione (solo per te, non compare negli export)">
      <${TextArea} rows="3" value=${t.descrizione} onInput=${v => set('descrizione', v)} />
    <//>
    <div class="grid3">
      <div class="field">
        <span class="field-label">Punteggio totale della verifica</span>
        <span class="total-big">${U.fmt(Calc.total(t, 'std'))}</span>
        <span class="hint">Calcolato: domande da valutare ${U.fmt(Calc.manualTotal(t, 'std'))}${Calc.closed(t, 'std').max ? ' + domande chiuse ' + U.fmt(Calc.closed(t, 'std').max) : ''}.
          Le domande da valutare valgono la somma dei massimi degli indicatori${Calc.standardWeights(t).biasSum ? ', più le correzioni' : ''}.</span>
      </div>
      <${Field} label="Voto minimo" hint=${Calc.votoRule(t, Calc.total(t, 'std'))}>
        <${NumInput} value=${t.votoMin} min=${0} max=${10} onChange=${v => set('votoMin', v === null ? 0 : U.clamp(v, 0, 10))} width="80px" />
      <//>
      <${Field} label="Uso del voto minimo">
        <select value=${t.votoModo} disabled=${!(U.num(t.votoMin) > 0)} onChange=${e => set('votoModo', e.target.value)}>
          <option value="soglia">Soglia: sotto il minimo si assegna il minimo</option>
          <option value="lineare">Scala: 0 punti = voto minimo, punteggio pieno = 10</option>
        </select>
      <//>
    </div>
    <div class="grid2">
      <${Field} label="Nota a piè di griglia">
        <${TextInput} value=${t.notaPiede} onInput=${v => set('notaPiede', v)} />
        <select value=${t.notaPiedeQuando} onChange=${e => set('notaPiedeQuando', e.target.value)}>
          <option value="bes">Mostra solo nelle versioni DSA / NAI / PEI</option>
          <option value="sempre">Mostra sempre</option>
          <option value="mai">Non mostrare</option>
        </select>
      <//>
    </div>`;
}

/* ---------------- Livelli ---------------- */

/** Riordina i livelli dal più alto e fissa il primo al 100 %. */
function tidyLevels(owner) {
  owner.livelli = Calc.sortedLevels(owner.livelli);
  if (owner.livelli.length) owner.livelli[0].max = 100;
}

/**
 * Editor di una scala di livelli (della verifica o di un indicatore).
 * Si modifica la percentuale massima di ogni livello; il più alto vale sempre fino al 100 %.
 */
function LevelsEditor({ owner, max, withDesc }) {
  const levels = owner.livelli;
  const ranges = max ? Calc.levelRanges(levels, max) : [];
  const rangeOf = l => ranges.find(r => r.level === l);
  return html`
    <table class="tbl compact levels-tbl">
      <thead><tr><th>Livello</th><th>Fino al</th>${max ? html`<th>Punti</th>` : null}${withDesc ? html`<th>Descrittore</th>` : null}<th></th></tr></thead>
      <tbody>${levels.map((l, i) => {
        const r = rangeOf(l);
        return html`<tr key=${l.id}>
          <td class="lv-name"><${TextInput} value=${l.nome} onInput=${v => { l.nome = v; changedTpl(); }} /></td>
          <td class="lv-pct nowrap">${i === 0 ? html`<span class="muted">100 %</span>` : html`<${NumInput} value=${l.max} min=${0} max=${99.99} width="64px"
            onChange=${v => { l.max = v === null ? 0 : v; changedTpl(); }} onBlur=${() => { tidyLevels(owner); changedTpl(); }} /> %`}</td>
          ${max ? html`<td class=${'nowrap c ' + (r && r.empty ? 'bad' : '')}>${r ? (r.empty ? 'vuoto' : Calc.rangeLabel(r)) : ''}</td>` : null}
          ${withDesc ? html`<td><${TextArea} rows="2" value=${l.descrittore} onInput=${v => { l.descrittore = v; changedTpl(); }} /></td>` : null}
          <td><${IconBtn} icon="✕" title="Elimina livello" disabled=${levels.length <= 1} onClick=${() => {
            owner.livelli = levels.filter(x => x !== l); tidyLevels(owner); changedTpl();
          }} /></td>
        </tr>`;
      })}</tbody>
    </table>
    <button class="btn small" onClick=${() => {
      const low = levels[levels.length - 1];
      levels.push({ id: U.uid('lv'), nome: '', max: low ? Math.floor((U.num(low.max) || 0) / 2) : 100, descrittore: '' });
      tidyLevels(owner); changedTpl();
    }}>+ Aggiungi livello</button>`;
}

/** Fasce percentuali di una scala: [{ level, text }] dal livello più alto. */
function percentBands(levels) {
  const sorted = Calc.sortedLevels(levels);
  return sorted.map((l, i) => {
    const top = i === 0 ? 100 : (U.num(l.max) || 0);
    const next = sorted[i + 1];
    const text = next
      ? 'oltre ' + U.fmt(U.num(next.max) || 0) + ' % e fino a ' + U.fmt(top) + ' %'
      : 'da 0 % a ' + U.fmt(top) + ' %';
    return { level: l, text, empty: next && (U.num(next.max) || 0) >= top };
  });
}

function BLivelli({ t }) {
  return html`
    <p class="muted">Questa è la scala che ricevono i nuovi indicatori. Ogni indicatore può poi avere livelli propri (numero, nomi e percentuali) nella scheda «Indicatori».
      Per ogni livello indichi fino a che percentuale del punteggio massimo arriva; il livello più alto arriva sempre al 100 %.</p>
    <div style="max-width:560px"><${LevelsEditor} owner=${t} /></div>
    <h3>Riepilogo fasce</h3>
    <table class="tbl compact" style="max-width:560px">
      <thead><tr><th>Livello</th><th>Fascia del punteggio massimo</th></tr></thead>
      <tbody>${percentBands(t.livelli).map(b => html`<tr key=${b.level.id}>
        <td>${b.level.nome || html`<span class="muted">senza nome</span>`}</td>
        <td class=${b.empty ? 'bad' : ''}>${b.empty ? 'vuota: controlla le percentuali' : b.text}</td>
      </tr>`)}</tbody>
    </table>
    ${t.indicatori.length ? html`<button class="btn" onClick=${async () => {
      if (!(await ask('Sostituire i livelli di tutti gli indicatori con questa scala? I descrittori dei livelli con lo stesso nome vengono mantenuti.', 'Applica'))) return;
      t.indicatori.forEach(ind => applyDefaultLevels(t, ind));
      changedTpl();
      toast(t.indicatori.length === 1 ? 'Scala applicata all’indicatore' : 'Scala applicata a ' + t.indicatori.length + ' indicatori');
    }}>Applica a tutti gli indicatori</button>` : null}`;
}

function applyDefaultLevels(t, ind) {
  const old = ind.livelli || [];
  ind.livelli = Model.copyLevels(t.livelli, false);
  ind.livelli.forEach(l => {
    const same = old.find(o => (o.nome || '').trim().toLowerCase() === (l.nome || '').trim().toLowerCase());
    if (same) l.descrittore = same.descrittore || '';
  });
}

/* ---------------- Indicatori ---------------- */
function BIndicatori({ t }) {
  const totMax = U.sum(t.indicatori, i => U.num(i.max) || 0);
  return html`
    <p class="muted">Il punteggio massimo è la scala su cui inserirai i voti in correzione (es. 0–20) e definisce il peso dell'indicatore nella verifica.
      Ogni indicatore ha i suoi livelli: puoi aggiungerne, toglierne e cambiarne le percentuali.</p>
    ${t.indicatori.map((ind, idx) => html`<div class="card" key=${ind.id}>
      <div class="row gap">
        <${Field} label=${'Indicatore ' + (idx + 1)} class="grow"><${TextInput} value=${ind.nome} onInput=${v => { ind.nome = v; changedTpl(); }} /><//>
        <${Field} label="Punteggio massimo"><${NumInput} value=${ind.max} min=${1} width="90px" onChange=${v => { ind.max = v === null ? 0 : Math.round(v); changedTpl(); }} /><//>
        <div class="field"><span class="field-label">Peso</span><span class="pill">${totMax ? U.fmt((U.num(ind.max) || 0) / totMax * 100, 1) + ' %' : '—'}</span></div>
        <div class="row end">
          <${IconBtn} icon="↑" title="Sposta su" disabled=${idx === 0} onClick=${() => { moveItem(t.indicatori, idx, -1); changedTpl(); }} />
          <${IconBtn} icon="↓" title="Sposta giù" disabled=${idx === t.indicatori.length - 1} onClick=${() => { moveItem(t.indicatori, idx, 1); changedTpl(); }} />
          <${IconBtn} icon="✕" title="Elimina indicatore" onClick=${async () => {
            if (!(await ask('Eliminare l’indicatore «' + (ind.nome || 'senza nome') + '»? Verrà tolto anche dalle domande da valutare.', 'Elimina', true))) return;
            t.indicatori = t.indicatori.filter(x => x !== ind);
            const strip = e => { e.indicatori = e.indicatori.filter(x => x !== ind.id); };
            t.esercizi.forEach(strip);
            t.versioni.forEach(v => v.aggiunti.forEach(strip));
            changedTpl();
          }} />
        </div>
      </div>
      <${LevelsEditor} owner=${ind} max=${U.num(ind.max) || 0} withDesc=${true} />
      <button class="btn small" title="Sostituisce i livelli con la scala predefinita della verifica" onClick=${async () => {
        if (!(await ask('Sostituire i livelli di questo indicatore con la scala predefinita? I descrittori dei livelli con lo stesso nome vengono mantenuti.', 'Sostituisci'))) return;
        applyDefaultLevels(t, ind); changedTpl();
      }}>Usa la scala predefinita</button>
      ${Calc.levelIssues(ind.livelli, U.num(ind.max) || 0).length ? html`<${Warnings} list=${Calc.levelIssues(ind.livelli, U.num(ind.max) || 0)} />` : null}
    </div>`)}
    <button class="btn" onClick=${() => { t.indicatori.push(Model.newIndicator(t)); changedTpl(); }}>+ Aggiungi indicatore</button>`;
}

/* ---------------- Esercizi ---------------- */
function ExerciseRow({ t, ex, idx, list, weight, extra }) {
  return html`<tr key=${ex.id}>
    <td class="nowrap">
      <${IconBtn} icon="↑" title="Sposta su" disabled=${idx === 0} onClick=${() => { moveItem(list, idx, -1); changedTpl(); }} />
      <${IconBtn} icon="↓" title="Sposta giù" disabled=${idx === list.length - 1} onClick=${() => { moveItem(list, idx, 1); changedTpl(); }} />
    </td>
    <td><${TextInput} value=${ex.nome} width="80px" onInput=${v => { ex.nome = v; changedTpl(); }} /></td>
    <td><${TextInput} value=${ex.testo} onInput=${v => { ex.testo = v; changedTpl(); }} /></td>
    ${t.indicatori.map(i => html`<td class="c"><input type="checkbox" checked=${ex.indicatori.includes(i.id)} title=${i.nome}
      onChange=${e => { ex.indicatori = e.target.checked ? t.indicatori.filter(x => x.id === i.id || ex.indicatori.includes(x.id)).map(x => x.id) : ex.indicatori.filter(x => x !== i.id); changedTpl(); }} /></td>`)}
    ${extra}
    <td><${NumInput} value=${ex.bias} width="56px" onChange=${v => { ex.bias = v === null ? 0 : Math.round(v); changedTpl(); }} /></td>
    <td class="c strong">${U.fmt(weight)}</td>
    <td><${IconBtn} icon="✕" title="Elimina domanda" onClick=${() => { list.splice(idx, 1); changedTpl(); }} /></td>
  </tr>`;
}

function BEsercizi({ t }) {
  const std = Calc.standardWeights(t);
  const [nAdd, setNAdd] = useState(1);
  return html`
    <p class="muted">Seleziona gli indicatori coinvolti in ogni domanda. Il punteggio di ogni indicatore si divide in parti uguali tra le domande che lo coprono:
      il «grezzo» di una domanda è la somma di queste parti (es. un indicatore da 20 coperto da 4 domande vale 5 in ciascuna).
      Il grezzo viene arrotondato a un intero («base») senza cambiare il totale. La <b>correzione</b> (il tuo bias) aggiunge o toglie punti per pesare la difficoltà:
      se le correzioni non sommano a zero cambia anche il totale della verifica.</p>
    <div class="table-scroll">
    <table class="tbl compact">
      <thead><tr>
        <th></th><th>Nome</th><th>Consegna</th>
        ${t.indicatori.map(i => html`<th class="vert" title=${i.nome}><span>${i.nome || '(senza nome)'}</span></th>`)}
        <th>Grezzo</th><th>Base</th><th>Correzione</th><th>Peso</th><th></th>
      </tr></thead>
      <tbody>
        ${t.esercizi.map((ex, idx) => html`<${ExerciseRow} key=${ex.id} t=${t} ex=${ex} idx=${idx} list=${t.esercizi} weight=${std.rows[ex.id].peso}
          extra=${html`<td class="c muted">${U.fmt(std.rows[ex.id].raw)}</td><td class="c">${U.fmt(std.rows[ex.id].base)}</td>`} />`)}
      </tbody>
      <tfoot><tr>
        <td colspan=${3 + t.indicatori.length} class="right">Totale</td>
        <td class="c muted">${U.fmt(std.R)}</td><td class="c">${U.fmt(Math.round(std.R))}</td>
        <td class=${'c ' + (std.biasSum ? 'bad' : '')}>${std.biasSum > 0 ? '+' : ''}${U.fmt(std.biasSum)}</td>
        <td class="c strong">${U.fmt(Calc.manualTotal(t, 'std'))}</td><td></td>
      </tr></tfoot>
    </table>
    </div>
    <div class="row gap wrap">
      <button class="btn" onClick=${() => { for (let k = 0; k < Math.max(1, nAdd); k++) t.esercizi.push(Model.newExercise(t)); changedTpl(); }}>+ Aggiungi</button>
      <${NumInput} value=${nAdd} min=${1} width="56px" onChange=${v => setNAdd(Math.max(1, Math.round(v || 1)))} /> <span class="muted">domande</span>
      <span class="spacer"></span>
      <span class="total-line">Totale verifica: ${U.fmt(Calc.total(t, 'std'))}${Calc.closed(t, 'std').max ? ' (domande da valutare ' + U.fmt(Calc.manualTotal(t, 'std')) + ' + domande chiuse ' + U.fmt(Calc.closed(t, 'std').max) + ')' : ''}</span>
    </div>
    <${Warnings} list=${Calc.warnings(t, 'std')} />
    <${MatrixView} t=${t} vId="std" />`;
}

function MatrixView({ t, vId }) {
  const M = Calc.matrix(t, vId);
  if (!M.rows.length || !M.used.length) return null;
  return html`<div class="card">
    <div class="row gap wrap">
      <h3 class="grow">Distribuzione dei punti</h3>
      <label class="field inline"><span class="field-label">Ripartizione dentro la domanda</span>
        <select value=${t.distribuzione} onChange=${e => { t.distribuzione = e.target.value; changedTpl(); }}>
          <option value="proporzionale">Proporzionale alle quote degli indicatori</option>
          <option value="bilanciata">Bilanciata sui pesi degli indicatori</option>
        </select>
      </label>
    </div>
    <p class="muted small">Ogni casella è il valore in punti di quell'indicatore in quella domanda. La somma per riga dà il punteggio della domanda, la somma per colonna il peso effettivo dell'indicatore: i due totali coincidono sempre.
      ${t.distribuzione === 'bilanciata' ? ' La ripartizione bilanciata modifica le caselle in modo che ogni indicatore pesi quanto previsto.' : ' Arrotondamenti e correzioni possono far scostare un po’ il peso effettivo di un indicatore da quello previsto: la modalità bilanciata lo riallinea.'}</p>
    <div class="table-scroll">
    <table class="tbl compact matrix">
      <thead><tr><th>Domanda</th>${M.used.map(i => html`<th>${i.nome}</th>`)}<th>Peso</th></tr></thead>
      <tbody>${M.rows.map(r => html`<tr>
        <td>${r.ex.nome}${r.ex.aggiunto ? html` <span class="tag">aggiunto</span>` : null}</td>
        ${M.used.map(i => html`<td class=${'c ' + (r.cells[i.id] === undefined ? 'off' : '')}>${r.cells[i.id] === undefined ? '–' : U.fmt(r.cells[i.id])}</td>`)}
        <td class="c strong">${U.fmt(r.peso)}</td>
      </tr>`)}</tbody>
      <tfoot>
        <tr><td>Peso effettivo</td>${M.used.map(i => html`<td class="c strong">${U.fmt(M.eff[i.id])}</td>`)}<td class="c strong">${U.fmt(M.Tm)}</td></tr>
        <tr><td class="muted">Peso previsto</td>${M.used.map(i => html`<td class=${'c muted ' + (Math.abs(M.eff[i.id] - M.nominal[i.id]) > 0.05 ? 'bad' : '')}>${U.fmt(M.nominal[i.id])}</td>`)}<td></td></tr>
      </tfoot>
    </table>
    </div>
  </div>`;
}

/* ---------------- Domande chiuse ---------------- */

/** Tabella delle risposte multiple (DM): nome, parti, punti. Usata nella verifica e nelle versioni. */
function MultipleTable({ list }) {
  if (!list.length) return null;
  return html`<table class="tbl compact" style="max-width:520px">
    <thead><tr><th>Domanda</th><th>Parti</th><th>Punti</th><th></th></tr></thead>
    <tbody>${list.map((q, i) => html`<tr key=${q.id}>
      <td><${TextInput} value=${q.nome} onInput=${v => { q.nome = v; changedTpl(); }} /></td>
      <td><${NumInput} value=${Calc.partsOf(q)} min=${1} width="60px" onChange=${v => { q.parti = Math.max(1, Math.round(v || 1)); delete q.coppie; changedTpl(); }} /></td>
      <td><${NumInput} value=${q.punti} min=${0} width="70px" onChange=${v => { q.punti = v || 0; changedTpl(); }} /></td>
      <td><${IconBtn} icon="✕" title="Elimina" onClick=${() => { list.splice(i, 1); changedTpl(); }} /></td>
    </tr>`)}</tbody>
  </table>`;
}

function BChiuse({ t }) {
  const c = t.chiuse;
  const C = Calc.closed(t, 'std');
  const s = c.singole;
  return html`
    <label class="check"><input type="checkbox" checked=${c.attive} onChange=${e => { c.attive = e.target.checked; changedTpl(); }} /> La verifica contiene domande a risposta chiusa</label>
    ${c.attive ? html`
      <p class="muted">Le domande chiuse formano un blocco a sé: il loro punteggio si somma a quello delle domande da valutare con la griglia.
        Punteggio totale ${U.fmt(Calc.total(t, 'std'))} = domande da valutare ${U.fmt(Calc.manualTotal(t, 'std'))} + domande chiuse ${U.fmt(C.max)}.</p>

      <h3>Risposte singole (DS)</h3>
      <div class="row gap wrap">
        <${NumInput} value=${s.numero} min=${0} width="64px" onChange=${v => { s.numero = Math.max(0, Math.round(v || 0)); changedTpl(); }} />
        <span>domande da</span>
        <${NumInput} value=${s.punti} min=${0} width="64px" onChange=${v => { s.punti = v || 0; changedTpl(); }} />
        <span>punti ciascuna</span>
        <span class="muted">= ${U.fmt((s.numero || 0) * (U.num(s.punti) || 0))} punti</span>
      </div>
      <div class="grid3" style="margin-top:10px">
        <${Field} label="Punti per risposta errata" hint="Anche negativo, es. -0,25"><${NumInput} value=${c.errata} width="90px" onChange=${v => { c.errata = v || 0; changedTpl(); }} /><//>
        <${Field} label="Punti per risposta non data"><${NumInput} value=${c.nonData} width="90px" onChange=${v => { c.nonData = v || 0; changedTpl(); }} /><//>
        <label class="check"><input type="checkbox" checked=${c.minimoZero} onChange=${e => { c.minimoZero = e.target.checked; changedTpl(); }} /> Il blocco non scende sotto zero</label>
      </div>

      <h3>Risposte multiple (DM)</h3>
      <p class="muted small">Associazioni, cloze, completamenti, più risposte da indicare…: hanno più parti e danno un punteggio parziale,
        punti × parti corrette / parti totali (es. 4 punti, 1 parte corretta su 4 = 1 punto). In correzione inserisci solo quante parti sono corrette.</p>
      <${MultipleTable} list=${c.domande} />
      <button class="btn" onClick=${() => { c.domande.push(Model.newMultiple()); changedTpl(); }}>+ Aggiungi risposta multipla (DM)</button>
      <div class="total-line">Totale domande chiuse: ${U.fmt(C.all)} punti</div>
    ` : null}`;
}

/* ---------------- Versioni ---------------- */
function BVersioni({ t }) {
  let v = t.versioni.find(x => x.id === S.editVersion) || t.versioni[0] || null;
  const add = tipo => {
    const nv = Model.newVersion(tipo);
    t.versioni.push(nv); S.editVersion = nv.id; changedTpl();
  };
  return html`
    <p class="muted">Le versioni (DSA, NAI, PEI…) partono dalla verifica standard: puoi togliere domande, cambiarne il testo, aggiungerne di nuove.
      Ogni domanda mantiene il punteggio che ha nella versione standard: il totale della versione è la somma di quello che contiene
      (la standard vale ${U.fmt(Calc.total(t, 'std'))}). Il voto si calcola sempre sul totale della versione svolta.</p>
    <div class="row gap wrap">
      ${Model.BES_TYPES.map(tp => html`<button class="btn" onClick=${() => add(tp)}>+ ${tp}</button>`)}
      <button class="btn" onClick=${() => add('ALTRO')}>+ Personalizzata</button>
    </div>
    ${t.versioni.length ? html`
      <${Tabs} items=${t.versioni.map(x => ({ id: x.id, label: x.nome || '(senza nome)', badge: U.fmt(Calc.total(t, x.id)) + ' pt' }))}
        value=${v.id} onChange=${id => { S.editVersion = id; refresh(); }} />
      <${VersionEditor} t=${t} v=${v} />` : html`<p class="empty">Nessuna versione oltre a quella standard.</p>`}`;
}

function VersionEditor({ t, v }) {
  const stdW = Calc.weights(t, 'std');
  const W = Calc.weights(t, v.id);
  const C = Calc.closed(t, v.id);
  const Tm = Calc.manualTotal(t, v.id);
  return html`<div class="card">
    <div class="row gap wrap">
      <${Field} label="Nome"><${TextInput} value=${v.nome} onInput=${x => { v.nome = x; changedTpl(); }} /><//>
      <${Field} label="Tipologia (per l'abbinamento con la colonna BES)">
        <select value=${v.tipo} onChange=${e => { v.tipo = e.target.value; changedTpl(); }}>
          ${Model.BES_TYPES.map(x => html`<option value=${x}>${x}</option>`)}<option value="ALTRO">Altro</option>
        </select>
      <//>
      <span class="spacer"></span>
      <button class="btn" onClick=${() => { const c = U.clone(v); c.id = U.uid('ver'); c.nome = v.nome + ' (copia)'; c.aggiunti.forEach(e => { const old = e.id; e.id = U.uid('es'); if (c.adj[old] !== undefined) { c.adj[e.id] = c.adj[old]; delete c.adj[old]; } }); t.versioni.push(c); S.editVersion = c.id; changedTpl(); }}>Duplica</button>
      <button class="btn danger" onClick=${async () => { if (!(await ask('Eliminare la versione ' + v.nome + '?', 'Elimina', true))) return; t.versioni = t.versioni.filter(x => x !== v); S.editVersion = null; changedTpl(); }}>Elimina</button>
    </div>
    <h3>Domande da valutare della verifica standard</h3>
    <div class="table-scroll">
    <table class="tbl compact">
      <thead><tr><th>Includi</th><th>Domanda</th><th>Testo personalizzato</th><th>Peso standard</th><th>Correzione</th><th>Peso in ${v.nome}</th></tr></thead>
      <tbody>${t.esercizi.map(ex => {
        const incl = !v.esclusi.includes(ex.id);
        return html`<tr key=${ex.id} class=${incl ? '' : 'dim'}>
          <td class="c"><input type="checkbox" checked=${incl} onChange=${e => { v.esclusi = e.target.checked ? v.esclusi.filter(x => x !== ex.id) : v.esclusi.concat(ex.id); changedTpl(); }} /></td>
          <td>${ex.nome}</td>
          <td><${TextInput} value=${v.testi[ex.id] || ''} onInput=${x => { v.testi[ex.id] = x; changedTpl(); }} /></td>
          <td class="c muted">${U.fmt(stdW[ex.id])}</td>
          <td>${incl ? html`<${NumInput} value=${v.adj[ex.id] || 0} width="56px" onChange=${x => { v.adj[ex.id] = x === null ? 0 : Math.round(x); changedTpl(); }} />` : null}</td>
          <td class="c strong">${incl ? U.fmt(W[ex.id]) : '–'}</td>
        </tr>`;
      })}</tbody>
    </table>
    </div>
    <h3>Domande da valutare aggiuntive di questa versione</h3>
    ${v.aggiunti.length ? html`<div class="table-scroll"><table class="tbl compact">
      <thead><tr><th></th><th>Nome</th><th>Consegna</th>${t.indicatori.map(i => html`<th class="vert" title=${i.nome}><span>${i.nome}</span></th>`)}<th>Correzione</th><th>Peso</th><th></th></tr></thead>
      <tbody>${v.aggiunti.map((ex, idx) => html`<${ExerciseRow} key=${ex.id} t=${t} ex=${ex} idx=${idx} list=${v.aggiunti} weight=${W[ex.id]} extra=${null} />`)}</tbody>
    </table></div>` : null}
    <button class="btn" onClick=${() => { const e = Model.newExercise(t, t.esercizi.concat(v.aggiunti)); v.aggiunti.push(e); changedTpl(); }}>+ Aggiungi domanda</button>
    <div class="total-line">Totale ${v.nome}: ${U.fmt(Tm + C.max)} punti${C.items.length ? ' (domande da valutare ' + U.fmt(Tm) + ' + domande chiuse ' + U.fmt(C.max) + ')' : ''}</div>
    ${t.chiuse.attive ? html`
      <h3>Domande chiuse</h3>
      <p class="muted small">Ogni domanda mantiene il suo punteggio: in questa versione il blocco vale ${U.fmt(C.max)} punti (verifica base: ${U.fmt(C.all)}).</p>
      <div class="row gap wrap">
        <b>Risposte singole (DS)</b>
        <${NumInput} value=${v.chiuseSingole != null ? v.chiuseSingole : t.chiuse.singole.numero} min=${0} width="64px"
          onChange=${x => { v.chiuseSingole = x === null ? null : Math.max(0, Math.round(x)); changedTpl(); }} />
        <span class="muted">domande da ${U.fmt(U.num(t.chiuse.singole.punti) || 0)} ${U.num(t.chiuse.singole.punti) === 1 ? 'punto' : 'punti'}
          (verifica base: ${t.chiuse.singole.numero || 0}${v.chiuseSingole != null && v.chiuseSingole !== t.chiuse.singole.numero ? '' : ', uguale'})</span>
        ${v.chiuseSingole != null && v.chiuseSingole !== t.chiuse.singole.numero
          ? html`<button class="btn small" onClick=${() => { v.chiuseSingole = null; changedTpl(); }}>Come la verifica base</button>` : null}
      </div>
      ${t.chiuse.domande.length ? html`
        <div class="muted small" style="margin-top:10px">Risposte multiple (DM) della verifica base da includere</div>
        <div class="chips">${t.chiuse.domande.map(q => {
          const incl = !v.chiuseEscluse.includes(q.id);
          return html`<label class=${'chip ' + (incl ? 'on' : '')}><input type="checkbox" checked=${incl}
            onChange=${e => { v.chiuseEscluse = e.target.checked ? v.chiuseEscluse.filter(x => x !== q.id) : v.chiuseEscluse.concat(q.id); changedTpl(); }} />
            ${q.nome} <span class="muted">${Calc.partsOf(q)} parti · ${U.fmt(U.num(q.punti) || 0)} pt</span></label>`;
        })}</div>` : null}
      <div class="muted small" style="margin-top:10px">Risposte multiple (DM) solo di questa versione</div>
      <${MultipleTable} list=${v.chiuseAggiunte} />
      <button class="btn small" onClick=${() => { v.chiuseAggiunte.push(Model.newMultiple()); changedTpl(); }}>+ Aggiungi risposta multipla</button>` : null}
    <${Warnings} list=${Calc.warnings(t, v.id)} />
    <${MatrixView} t=${t} vId=${v.id} />
  </div>`;
}

/* ---------------- Griglia ed export ---------------- */
function versionOptions(t) {
  return [{ id: 'std', nome: 'Standard' }].concat(t.versioni.map(v => ({ id: v.id, nome: v.nome })));
}

function BGriglia({ t }) {
  if (!t.versioni.find(v => v.id === S.previewVersion)) S.previewVersion = 'std';
  const vId = S.previewVersion;
  const d = Grid.data(t, vId, null);
  const exs = Calc.exercises(t, vId);
  const W = Calc.weights(t, vId);
  const C = Calc.closed(t, vId);
  const title = Model.templateTitle(t);
  const vName = Model.versionName(t, vId);
  const fname = ext => U.safeName('Griglia - ' + title + (vId === 'std' ? '' : ' - ' + vName)) + '.' + ext;
  const listText = exs.map(e => e.nome + ': ' + U.fmt(W[e.id]) + ' punti').concat(C.items.length ? ['Domande chiuse: ' + U.fmt(C.max) + ' punti'] : []).join('\n');
  const all = () => versionOptions(t).map(o => Grid.data(t, o.id, null));
  return html`
    <div class="row gap wrap">
      <${Field} label="Versione" class="inline">
        <select value=${vId} onChange=${e => { S.previewVersion = e.target.value; refresh(); }}>
          ${versionOptions(t).map(o => html`<option value=${o.id}>${o.nome}</option>`)}
        </select>
      <//>
      <span class="spacer"></span>
      <button class="btn primary" onClick=${() => withBusy('Creo il PDF…', async () => deliver(await Grid.pdf([d]), fname('pdf')))}>PDF</button>
      <button class="btn" onClick=${() => withBusy('Creo l’HTML…', async () => deliver(new Blob([Grid.htmlDocument(title, [Grid.html(d)])], { type: 'text/html' }), fname('html')))}>HTML</button>
      ${t.versioni.length ? html`<button class="btn" onClick=${() => withBusy('Creo il PDF…', async () => deliver(await Grid.pdf(all()), U.safeName('Griglie - ' + title + ' - tutte le versioni') + '.pdf'))}>PDF di tutte le versioni</button>` : null}
    </div>
    <${Warnings} list=${Calc.warnings(t, vId)} />
    <div class="grid-preview" dangerouslySetInnerHTML=${{ __html: Grid.html(d) }}></div>
    <div class="card">
      <div class="row gap"><h3 class="grow">Punteggi da riportare nel compito (${vName})</h3>
        <button class="btn" onClick=${() => { navigator.clipboard.writeText(listText).then(() => toast('Copiato negli appunti'), () => toast('Copia non riuscita', 'error')); }}>Copia</button></div>
      <table class="tbl compact" style="max-width:640px">
        <tbody>${exs.map(e => html`<tr><td>${e.nome}</td><td class="muted">${e.testo}</td><td class="c strong">${U.fmt(W[e.id])} pt</td></tr>`)}
        ${C.items.length ? html`<tr><td>Domande chiuse</td><td class="muted">${C.items.length} domande</td><td class="c strong">${U.fmt(C.max)} pt</td></tr>` : null}</tbody>
      </table>
    </div>`;
}

/* =====================================================================
 * ui-session.js — valutazione di una classe

function Session() {
  const s = S.ses;
  const t = s.template;
  const done = s.studenti.filter(st => !st.assente && Calc.score(t, st.versione, st).completo).length;
  const present = s.studenti.filter(st => !st.assente).length;
  const stateLabel = { idle: '', saved: 'JSON scaricato', pending: 'Modifiche non ancora scaricate in JSON' }[S.saveState] || '';
  const body = { classe: SClasse, correzione: SCorrezione, riepilogo: SRiepilogo }[S.sesTab];
  return html`<div class="page">
    <div class="page-head">
      <div>
        <div class="eyebrow">Valutazione${s.classe ? ' · classe ' + s.classe : ''}</div>
        <h1>${Model.templateTitle(t)}</h1>
        <div class=${'muted small save-' + S.saveState}>${stateLabel}</div>
      </div>
      <div class="actions">
        <button class="btn primary" onClick=${saveSession}>Salva (scarica JSON)</button>
        <button class="btn" title="Apre la verifica nell'editor; i punteggi già inseriti restano" onClick=${editSessionTemplate}>Modifica verifica</button>
      </div>
    </div>
    <${Tabs} value=${S.sesTab} onChange=${v => { S.sesTab = v; refresh(); }} items=${[
      { id: 'classe', label: 'Classe e studenti', badge: s.studenti.length || null },
      { id: 'correzione', label: 'Correzione', badge: present ? done + '/' + present : null },
      { id: 'riepilogo', label: 'Riepilogo ed export' }
    ]} />
    <div class="panel"><${body} s=${s} /></div>
  </div>`;
}

/* ---------------- Classe e studenti ---------------- */
function SClasse({ s }) {
  const t = s.template;
  const vopts = versionOptions(t);

  const importRows = (rows, fileName) => {
    const list = ClassList.toStudents(rows);
    if (!list.length) { toast('Nessuno studente trovato nel file (servono le colonne nome, cognome, BES)', 'error'); return; }
    const key = x => (U.studentName(x)).toLowerCase();
    const existing = new Set(s.studenti.map(key));
    let added = 0;
    list.forEach(x => {
      if (existing.has(key(x))) return;
      const st = Model.newStudent(x.cognome, x.nome, Model.versionForBes(t, x.bes));
      st.bes = x.bes && x.bes.toLowerCase() !== 'no' ? x.bes.toUpperCase() : '';
      s.studenti.push(st); added++;
    });
    const cls = ClassList.classFromName(fileName);
    if (cls && !s.classe) s.classe = cls;
    changedSes();
    toast(added ? 'Aggiunti ' + added + ' studenti' : 'Tutti gli studenti erano già presenti');
  };

  const fromFile = async () => {
    const f = await Files.pickFile('.csv,.xlsx,.xls,.ods,.txt');
    if (!f) return;
    await withBusy('Leggo il file…', async () => importRows(await ClassList.parseFile(f), f.name));
  };

  const replaceTemplate = async obj => {
    if (!obj || obj.tipo !== 'template') { toast('Il file non è una verifica', 'error'); return; }
    if (obj.id !== t.id && !(await ask('Questa verifica ha un identificativo diverso: i punteggi già inseriti potrebbero non corrispondere. Continuare?', 'Continua'))) return;
    applyTemplateToSession(s, obj);
    toast('Verifica aggiornata');
  };

  return html`
    <div class="grid3">
      <${Field} label="Classe"><${TextInput} value=${s.classe} onInput=${v => { s.classe = v; changedSes(); }} /><//>
      <${Field} label="Data predefinita" hint="Vale per chi non ha una data propria.">
        <input type="date" value=${s.data} onInput=${e => { s.data = e.target.value; changedSes(); }} />
      <//>
      <div class="field"><span class="field-label">Verifica</span>
        <div class="row gap wrap">
          <span class="pill">${vopts.map(o => o.nome).join(' · ')}</span>
          <button class="btn small" title="Apre la verifica nell'editor; i punteggi già inseriti restano" onClick=${editSessionTemplate}>Modifica verifica</button>
          <button class="btn small" title="Se hai modificato la verifica dopo aver iniziato: i punteggi già inseriti restano"
            onClick=${async () => replaceTemplate(await importJSONFile())}>Sostituisci da JSON</button>
        </div>
      </div>
    </div>

    <div class="card row gap wrap">
      <b>Carica elenco studenti</b>
      <button class="btn" onClick=${fromFile}>Scegli file (CSV / Excel)</button>
      <span class="muted small">Colonne: nome, cognome, BES (vuoto o «no» = standard; DSA, NAI, PEI)</span>
    </div>

    ${s.studenti.length ? html`<div class="table-scroll"><table class="tbl compact">
      <thead><tr><th>#</th><th>Cognome</th><th>Nome</th><th>BES</th><th>Versione</th><th>Data</th><th>Assente</th><th></th></tr></thead>
      <tbody>${[...s.studenti].sort(U.compareStudents).map((st, i) => {
        const mismatch = st.bes && st.versione === 'std' && Model.versionForBes(t, st.bes) === 'std';
        return html`<tr key=${st.id} class=${st.assente ? 'dim' : ''}>
          <td class="muted">${i + 1}</td>
          <td><${TextInput} value=${st.cognome} onInput=${v => { st.cognome = v; changedSes(); }} /></td>
          <td><${TextInput} value=${st.nome} onInput=${v => { st.nome = v; changedSes(); }} /></td>
          <td>${st.bes ? html`<span class="tag">${st.bes}</span>` : null}</td>
          <td><select value=${st.versione} onChange=${e => { st.versione = e.target.value; changedSes(); }}>
            ${vopts.map(o => html`<option value=${o.id}>${o.nome}</option>`)}</select>
            ${mismatch ? html`<span class="warn-text small" title="Nella verifica non c'è una versione con questa tipologia"> nessuna versione ${st.bes}</span>` : null}</td>
          <td><input type="date" value=${st.data || ''} title="Lascia vuoto per usare la data predefinita" onInput=${e => { st.data = e.target.value; changedSes(); }} /></td>
          <td class="c"><input type="checkbox" checked=${st.assente} onChange=${e => { st.assente = e.target.checked; changedSes(); }} /></td>
          <td><${IconBtn} icon="✕" title="Elimina studente" onClick=${async () => {
            if (Calc.score(t, st.versione, st).iniziato && !(await ask('Lo studente ha già dei punteggi. Eliminarlo?', 'Elimina', true))) return;
            s.studenti = s.studenti.filter(x => x !== st); changedSes();
          }} /></td>
        </tr>`;
      })}</tbody>
    </table></div>` : html`<p class="empty">Nessuno studente: carica un elenco o aggiungili a mano.</p>`}
    <div class="row gap">
      <button class="btn" onClick=${() => { s.studenti.push(Model.newStudent('', '', 'std')); changedSes(); }}>+ Aggiungi studente</button>
      <span class="spacer"></span>
      ${s.studenti.length ? html`<button class="btn primary" onClick=${() => { S.sesTab = 'correzione'; refresh(); }}>Vai alla correzione →</button>` : null}
    </div>`;
}

/* ---------------- Correzione ---------------- */
function studentStatus(t, st) {
  if (st.assente) return { cls: 'absent', label: 'assente' };
  const r = Calc.score(t, st.versione, st);
  if (r.completo) return { cls: 'done', label: U.fmt(r.votoArr, 1), res: r };
  if (r.iniziato) return { cls: 'partial', label: 'in corso', res: r };
  return { cls: 'todo', label: 'da fare', res: r };
}

function SCorrezione({ s }) {
  const t = s.template;
  const sorted = [...s.studenti].sort(U.compareStudents);
  if (!sorted.length) return html`<p class="empty">Aggiungi prima gli studenti nella scheda «Classe e studenti».</p>`;
  let cur = s.studenti.find(x => x.id === S.cur);
  if (!cur) { cur = sorted.find(x => !x.assente) || sorted[0]; S.cur = cur.id; }
  const dates = [...new Set(sorted.map(st => st.data || s.data))];
  return html`<div class="eval-layout">
    <aside class="student-list">
      ${sorted.map(st => {
        const stt = studentStatus(t, st);
        return html`<button key=${st.id} class=${'student ' + (st.id === cur.id ? 'active ' : '') + stt.cls} onClick=${() => { S.cur = st.id; refresh(); }}>
          <span class="name">${U.studentName(st) || '(senza nome)'}</span>
          <span class="meta">${dates.length > 1 ? U.dateIT(st.data || s.data) + ' · ' : ''}${st.versione !== 'std' ? Model.versionName(t, st.versione) + ' · ' : ''}${stt.label}</span>
        </button>`;
      })}
    </aside>
    <${StudentEval} key=${cur.id} s=${s} st=${cur} sorted=${sorted} />
  </div>`;
}

function focusNext(e, dir) {
  const box = e.target.closest('.eval-main');
  const inputs = [...box.querySelectorAll('input[data-nav]')].sort((a, b) => a.dataset.nav - b.dataset.nav);
  const i = inputs.indexOf(e.target);
  const nx = inputs[i + dir];
  if (nx) { nx.focus(); }
}

/**
 * Domande chiuse in correzione.
 * - Risposta singola, tutte dello stesso valore: solo i numeri di corrette, errate e non date
 *   (le non date si completano da sole finché non le modifichi).
 * - Risposta singola con valori diversi: si segna ogni domanda.
 * - Risposta composta (associazioni, cloze…): per ogni domanda il numero di parti corrette.
 */
function ClosedBlock({ t, st, C, res, onKey }) {
  const n = C.singole.length;
  if (!st.chiuseConteggi) st.chiuseConteggi = {};
  if (!st.chiuseParziali) st.chiuseParziali = Object.assign({}, st.chiuseAssoc || {}); // nome usato nelle prime versioni
  delete st.chiuseAssoc;
  const P = st.chiuseParziali;
  const k = st.chiuseConteggi;
  const has = k.C != null || k.E != null || k.N != null;
  if (C.uniform && !has && st.chiuse && Object.keys(st.chiuse).length) Object.assign(k, Calc.closedCounts(st, C)); // valutazioni salvate prima
  const set = (field, v) => {
    k[field] = v === null ? null : Math.max(0, Math.round(v));
    if (field === 'N') k.Nauto = v === null;
    else if (k.Nauto !== false) k.N = (k.C == null && k.E == null) ? null : Math.max(0, n - (k.C || 0) - (k.E || 0));
    changedSes();
  };
  const sum = (k.C || 0) + (k.E || 0) + (k.N || 0);
  const fields = n ? [['C', 'Corrette', U.fmt(C.singole[0].valore) + ' pt'], ['E', 'Errate', U.fmt(U.num(t.chiuse.errata) || 0) + ' pt'], ['N', 'Non date', U.fmt(U.num(t.chiuse.nonData) || 0) + ' pt']] : [];
  const allCorrect = () => {
    if (C.uniform) st.chiuseConteggi = { C: n, E: 0, N: 0 };
    else C.singole.forEach(q => { st.chiuse[q.id] = 'C'; });
    C.composte.forEach(q => { P[q.id] = q.parti; });
    changedSes();
  };
  return html`<div class="card">
    <div class="row gap wrap"><h3 class="grow">Domande a risposta chiusa</h3>
      <button class="btn small" onClick=${allCorrect}>Tutte corrette</button>
      <button class="btn small" onClick=${() => { st.chiuseConteggi = {}; st.chiuse = {}; st.chiuseParziali = {}; changedSes(); }}>Azzera</button></div>

    ${n && C.uniform ? html`
      <div class="muted small">Risposta singola (DS): ${n} domande</div>
      <div class="row gap wrap closed-counts">
        ${fields.map(([f, label, hint], i) => html`<label class="field inline">
          <span class="field-label">${label}</span>
          <${NumInput} value=${k[f]} min=${0} max=${n} width="64px" nav=${100000 + i} onKeyDown=${onKey} onChange=${v => set(f, v)} />
          <span class="muted small">× ${hint}</span>
        </label>`)}
      </div>
      ${sum > n ? html`<div class="small bad">La somma (${sum}) supera il numero di domande (${n}).</div>`
        : sum < n && has ? html`<div class="small muted">Mancano ${n - sum} domande.</div>` : null}` : null}

    ${n && !C.uniform ? html`
      <div class="muted small">Risposta singola (DS): le domande hanno punteggi diversi, segna ciascuna.</div>
      <div class="closed-grid">${C.singole.map(q => html`<div class="closed-q">
        <span class="qn">${q.nome}</span>
        ${[['C', '✓', 'corretta'], ['E', '✗', 'errata'], ['N', '–', 'non data']].map(([kk, ic, lab]) => html`
          <button class=${'qbtn q' + kk + (st.chiuse[q.id] === kk ? ' on' : '')} title=${lab}
            onClick=${() => { if (st.chiuse[q.id] === kk) delete st.chiuse[q.id]; else st.chiuse[q.id] = kk; changedSes(); }}>${ic}</button>`)}
      </div>`)}</div>` : null}

    ${C.composte.length ? html`
      <div class="muted small">Risposta multipla (DM): inserisci quante parti sono corrette</div>
      <div class="row gap wrap closed-counts">
        ${C.composte.map((q, i) => {
          const x = Calc.partialValue(st, q);
          return html`<label class="field inline">
            <span class="field-label">${q.nome}</span>
            <${NumInput} value=${P[q.id]} min=${0} max=${q.parti} width="56px" nav=${100010 + i} onKeyDown=${onKey}
              onChange=${v => { if (v === null) delete P[q.id]; else P[q.id] = Math.round(v); changedSes(); }} />
            <span class="muted small">/ ${q.parti} · ${x === null ? U.fmt(q.valore) + ' pt' : U.fmt(q.valore * x / q.parti) + ' / ' + U.fmt(q.valore) + ' pt'}</span>
          </label>`;
        })}
      </div>` : null}

    <div class="small muted">Punti domande chiuse: ${U.fmt(res.chiuse)} / ${U.fmt(C.max)}</div>
  </div>`;
}

/**
 * Frecce nella griglia di correzione: su/giù cambiano indicatore, sinistra/destra esercizio.
 * Le caselle non previste (indicatore non coinvolto, esercizio N.S.) vengono saltate.
 * Sinistra/destra spostano solo se il cursore è già all'inizio/alla fine del numero
 * (o se il numero è tutto selezionato, come appena entri nella casella).
 */
function moveWithArrows(e, rows, cols) {
  const dir = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
  const el = e.target;
  if (!dir || el.dataset.r === undefined || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
  if (dir[1]) {
    const len = el.value.length, a = el.selectionStart, b = el.selectionEnd;
    const all = a === 0 && b === len;
    if (dir[1] < 0 && !(all || b === 0)) return;
    if (dir[1] > 0 && !(all || a === len)) return;
  }
  e.preventDefault();
  const box = el.closest('.eval-main');
  let r = +el.dataset.r, c = +el.dataset.c;
  while (true) {
    r += dir[0]; c += dir[1];
    if (r < 0 || c < 0 || r >= rows || c >= cols) return;
    const next = box.querySelector('input[data-r="' + r + '"][data-c="' + c + '"]');
    if (next) { next.focus(); return; }
  }
}

/** Classe colore di un livello (0 = il più alto); l'ultimo è sempre il rosso. */
function levelClass(count, rank) {
  return rank === count - 1 ? 'lvlow' : 'lv' + Math.min(rank, 3);
}

function StudentEval({ s, st, sorted }) {
  const t = s.template;
  const res = Calc.score(t, st.versione, st);
  const M = res.matrix;
  const C = res.closed;
  const others = sorted.filter(x => !x.assente || x.id === st.id);
  const pos = others.indexOf(st);
  const go = d => { const n = others[pos + d]; if (n) { S.cur = n.id; refresh(); } };
  const setScore = (exId, indId, v) => {
    st.punteggi[exId] = st.punteggi[exId] || {};
    if (v === null) delete st.punteggi[exId][indId]; else st.punteggi[exId][indId] = v;
    changedSes();
  };
  const fileBase = U.safeName((s.classe ? s.classe + ' - ' : '') + U.studentName(st) + ' - ' + (t.argomento || t.materia || 'verifica'));
  const nInd = M.used.length;
  const onKey = e => {
    if (e.key === 'Enter') { e.preventDefault(); focusNext(e, e.shiftKey ? -1 : 1); return; }
    moveWithArrows(e, nInd, M.rows.length);
  };
  const [focus, setFocus] = useState(null);
  const [hover, setHover] = useState(null);

  // descrittore da mostrare: livello sotto il mouse, altrimenti quello del punteggio della casella attiva
  let hint = null;
  const hintFor = (ind, level) => {
    const ranges = Calc.levelRanges(ind.livelli, U.num(ind.max) || 0);
    const k = ranges.findIndex(r => r.level === level);
    return k < 0 ? null : { ind, range: ranges[k], cls: levelClass(ranges.length, k) };
  };
  if (hover) {
    const ind = t.indicatori.find(i => i.id === hover.indId);
    const level = ind && ind.livelli.find(l => l.id === hover.levelId);
    if (level) hint = hintFor(ind, level);
  } else if (focus) {
    const ind = t.indicatori.find(i => i.id === focus.indId);
    const v = ind && st.punteggi[focus.exId] ? U.num(st.punteggi[focus.exId][ind.id]) : null;
    if (v !== null) hint = hintFor(ind, Calc.levelOf(ind.livelli, U.num(ind.max) || 0, v));
  }

  return html`<section class="eval-main">
    <div class="row gap wrap eval-head">
      <button class="btn small" disabled=${pos <= 0} onClick=${() => go(-1)}>←</button>
      <h2 class="grow">${U.studentName(st) || '(senza nome)'}</h2>
      <label class="field inline"><span class="field-label">Versione</span>
        <select value=${st.versione} onChange=${e => { st.versione = e.target.value; changedSes(); }}>
          ${versionOptions(t).map(o => html`<option value=${o.id}>${o.nome}</option>`)}</select></label>
      <label class="field inline"><span class="field-label">Data</span>
        <input type="date" value=${st.data || s.data} onInput=${e => { st.data = e.target.value === s.data ? '' : e.target.value; changedSes(); }} /></label>
      <label class="check"><input type="checkbox" checked=${st.assente} onChange=${e => { st.assente = e.target.checked; changedSes(); }} /> Assente</label>
      <button class="btn small" disabled=${pos >= others.length - 1} onClick=${() => go(1)}>→</button>
    </div>

    ${st.assente ? html`<p class="empty">Studente assente. Togli la spunta quando recupera la verifica (puoi indicare una data diversa).</p>` : html`
    <p class="muted small">Inserisci il punteggio sulla scala di ogni indicatore. Con le frecce ti sposti tra le caselle; Invio passa alla successiva domanda per domanda, Maiusc+Invio torna indietro.</p>
    <div class="table-scroll">
    <table class="tbl eval">
      <thead>
        <tr><th>Indicatore</th>${M.rows.map(r => html`<th class="ex-head"><div>${r.ex.nome}</div><div class="muted small">${U.fmt(r.peso)} pt</div></th>`)}<th>Indicatore</th></tr>
        <tr class="sub"><th></th>${M.rows.map(r => html`<th><label class="check tiny" title="Domanda non svolta: tutti gli indicatori a 0">
          <input type="checkbox" checked=${!!st.nonSvolti[r.ex.id]} onChange=${e => { if (e.target.checked) st.nonSvolti[r.ex.id] = true; else delete st.nonSvolti[r.ex.id]; changedSes(); }} />N.S.</label></th>`)}<th></th></tr>
      </thead>
      <tbody>${M.used.map((ind, ri) => {
        const max = U.num(ind.max) || 0;
        const ir = res.indicatori[ind.id];
        const ranges = Calc.levelRanges(ind.livelli, max);
        // fascia della casella su cui stai scrivendo, evidenziata nella legenda della riga
        const focusVal = focus && focus.indId === ind.id && st.punteggi[focus.exId] ? U.num(st.punteggi[focus.exId][ind.id]) : null;
        const focusLv = focusVal === null ? null : Calc.levelOf(ind.livelli, max, focusVal);
        return html`<tr key=${ind.id} class=${focus && focus.indId === ind.id ? 'row-focus' : ''}>
          <th class="ind-name">
            <div>${ind.nome} <span class="muted small">(0 – ${max})</span></div>
            <ul class="bands">${ranges.map((r, k) => html`<li key=${r.level.id}
              onMouseEnter=${() => setHover({ indId: ind.id, levelId: r.level.id })} onMouseLeave=${() => setHover(null)}
              class=${'band ' + levelClass(ranges.length, k) + (focusLv === r.level ? ' active' : '') + (hover && hover.levelId === r.level.id && hover.indId === ind.id ? ' hover' : '')}>
              <span class="b-range">${Calc.rangeLabel(r)}</span><span class="b-name">${r.level.nome}</span>
            </li>`)}</ul>
          </th>
          ${M.rows.map((r, ci) => {
            if (r.cells[ind.id] === undefined) return html`<td class="off">–</td>`;
            if (st.nonSvolti[r.ex.id]) return html`<td class="ns">N.S.</td>`;
            const v = st.punteggi[r.ex.id] ? st.punteggi[r.ex.id][ind.id] : null;
            const lv = Calc.levelOf(ind.livelli, max, U.num(v));
            const rank = lv ? ranges.findIndex(x => x.level === lv) : -1;
            return html`<td class=${'cell ' + (rank >= 0 ? levelClass(ranges.length, rank) : '')}>
              <${NumInput} value=${v} min=${0} max=${max} nav=${ci * nInd + ri} row=${ri} col=${ci} onKeyDown=${onKey} onChange=${x => setScore(r.ex.id, ind.id, x)}
                onFocus=${() => setFocus({ exId: r.ex.id, indId: ind.id })} onBlur=${() => setFocus(null)} />
              <div class="lvname">${lv ? lv.nome : ''}</div>
            </td>`;
          })}
          <td class="c ind-res"><b>${U.fmt(ir.punti)}</b> / ${U.fmt(ir.max)}<div class="muted small">media ${U.fmt(ir.media)} / ${max}</div></td>
        </tr>`;
      })}</tbody>
      <tfoot><tr><th>Punti domanda</th>${M.rows.map(r => {
        const x = res.esercizi[r.ex.id];
        return html`<td class=${'c ' + (x.completo ? '' : 'muted')}><b>${U.fmt(x.punti)}</b> / ${U.fmt(x.max)}</td>`;
      })}<td class="c"><b>${U.fmt(res.manuale)}</b> / ${U.fmt(M.Tm)}</td></tr></tfoot>
    </table>
    </div>

    <div class=${'desc-bar ' + (hint ? hint.cls : 'empty')} aria-live="polite">
      ${hint ? html`
        <div class="desc-head">
          <span class="desc-ind">${hint.ind.nome}</span>
          <span class=${'desc-level ' + hint.cls}>${hint.range.level.nome || 'livello'}</span>
          <span class="muted">${Calc.rangeLabel(hint.range)}</span>
        </div>
        <div class="desc-text">${hint.range.level.descrittore || html`<span class="muted">Nessun descrittore per questo livello.</span>`}</div>`
      : html`<span class="muted">Passa sopra un livello o scrivi un punteggio per leggere il descrittore.</span>`}
    </div>

    ${C.items.length ? html`<${ClosedBlock} t=${t} st=${st} C=${C} res=${res} onKey=${onKey} />` : null}

    <div class="result-bar">
      <div><span class="muted">Domande</span><b>${U.fmt(res.manuale)}</b><span class="muted">/ ${U.fmt(M.Tm)}</span></div>
      ${C.items.length ? html`<div><span class="muted">Chiuse</span><b>${U.fmt(res.chiuse)}</b><span class="muted">/ ${U.fmt(C.max)}</span></div>` : null}
      <div><span class="muted">Totale</span><b>${U.fmt(res.totale)}</b><span class="muted">/ ${U.fmt(res.max)}</span></div>
      <div><span class="muted">Voto</span><b>${U.fmtFixed(res.voto, 2)}</b></div>
      <div class="big"><span class="muted">Arrotondato</span><b>${U.fmt(res.votoArr, 1)}</b></div>
      ${res.completo ? null : html`<div class="warn-text small">griglia incompleta</div>`}
    </div>

    <${Field} label="Note (solo per te, non esportate)"><${TextArea} rows="2" value=${st.note} onInput=${v => { st.note = v; changedSes(); }} /><//>

    <div class="row gap wrap">
      <button class="btn" onClick=${() => withBusy('Creo il PDF…', async () => deliver(await Grid.pdf([Grid.data(t, st.versione, st, s)]), fileBase + '.pdf'))}>PDF studente</button>
      <button class="btn" onClick=${() => withBusy('Creo l’Excel…', async () => deliver(await Grid.xlsxBlob(wb => Grid.xlsxSheet(wb, Grid.sheetName(U.studentName(st), new Set()), Grid.data(t, st.versione, st, s))), fileBase + '.xlsx'))}>XLSX studente</button>
    </div>
    `}
  </section>`;
}

/* ---------------- Riepilogo ---------------- */
function SRiepilogo({ s }) {
  const t = s.template;
  const cols = Summary.columns(s);
  const rows = Summary.rows(s);
  const valid = rows.filter(r => !r.assente && r.res.iniziato);
  const avg = valid.length ? U.sum(valid, r => r.res.voto) / valid.length : null;
  const suff = valid.filter(r => r.res.votoArr >= 6).length;
  const hasClosed = !!t.chiuse.attive;
  const title = Model.templateTitle(t);
  const base = U.safeName((s.classe ? s.classe + ' - ' : '') + title);
  const present = rows.filter(r => !r.assente);
  const incomplete = present.filter(r => !r.res.completo).length;

  // un PDF per studente, tutti dentro un unico file ZIP (un solo download)
  const zipPdf = () => withBusy('Creo i PDF…', async () => {
    const JSZip = await Libs.zip();
    const zip = new JSZip();
    const used = new Set();
    for (const r of present) {
      let name = U.safeName(U.studentName(r.st) || 'studente');
      for (let k = 2; used.has(name.toLowerCase()); k++) name = U.safeName(U.studentName(r.st)) + ' (' + k + ')';
      used.add(name.toLowerCase());
      zip.file(name + '.pdf', await Grid.pdf([Grid.data(t, r.st.versione, r.st, s)]));
    }
    deliver(await zip.generateAsync({ type: 'blob' }), base + ' - PDF studenti.zip');
  });

  return html`
    <div class="stats">
      <div><span class="muted">Valutati</span><b>${valid.length}</b></div>
      <div><span class="muted">Media voti</span><b>${avg === null ? '–' : U.fmtFixed(avg, 2)}</b></div>
      <div><span class="muted">Sufficienti</span><b>${suff}</b><span class="muted">/ ${valid.length}</span></div>
      <div><span class="muted">Assenti</span><b>${rows.length - present.length}</b></div>
    </div>
    ${incomplete ? html`<div class="alert warn">⚠ ${incomplete} griglie non sono complete.</div>` : null}
    <div class="row gap wrap">
      <button class="btn primary" onClick=${() => withBusy('Creo l’Excel…', async () => deliver(await Summary.xlsx(s, true), base + ' - griglie.xlsx'))}>XLSX riepilogo + griglie</button>
      <button class="btn" onClick=${() => withBusy('Creo il PDF…', async () => deliver(await Grid.pdf(present.map(r => Grid.data(t, r.st.versione, r.st, s))), base + ' - griglie.pdf'))}>PDF con tutte le griglie</button>
      <button class="btn" onClick=${zipPdf}>ZIP con un PDF per studente</button>
    </div>
    <div class="table-scroll">
    <table class="tbl compact summary">
      <thead><tr><th>Studente</th><th>Data</th><th>Versione</th>${cols.map(c => html`<th>${c.nome}</th>`)}${hasClosed ? html`<th>Chiuse</th>` : null}<th>Punteggio</th><th>Voto</th><th>Arr.</th></tr></thead>
      <tbody>${rows.map(({ st, res, assente }) => html`<tr key=${st.id} class=${assente ? 'dim' : ''} onClick=${() => { S.cur = st.id; S.sesTab = 'correzione'; refresh(); }} style="cursor:pointer">
        <td>${U.studentName(st)}</td><td>${U.dateIT(st.data || s.data)}</td><td>${Model.versionName(t, st.versione)}</td>
        ${assente ? html`<td colspan=${cols.length + (hasClosed ? 1 : 0) + 3} class="c muted">assente</td>` : html`
          ${cols.map(c => { const x = res.esercizi[c.id]; return html`<td class="c">${!x ? '–' : x.nonSvolto ? 'N.S.' : U.fmt(x.punti)}</td>`; })}
          ${hasClosed ? html`<td class="c">${U.fmt(res.chiuse)}</td>` : null}
          <td class="c">${U.fmt(res.totale)} / ${U.fmt(res.max)}</td>
          <td class="c">${U.fmtFixed(res.voto, 2)}</td>
          <td class=${'c strong ' + (res.votoArr >= 6 ? 'good' : 'bad')}>${U.fmt(res.votoArr, 1)}${res.completo ? '' : ' *'}</td>`}
      </tr>`)}</tbody>
    </table>
    </div>
    <p class="muted small">* griglia incompleta. Clic su una riga per aprire la correzione.</p>`;
}

/* =====================================================================

const APP_VERSION = '2026-10-24c';

function fmtWhen(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('it-IT') + ' ' + d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
}

function Home() {
  const draft = Draft.read();
  /** Apre un JSON: una verifica (per modificarla o per valutare) oppure una valutazione già iniziata. */
  const openJSON = async want => {
    const obj = await importJSONFile();
    if (!obj) return;
    if (obj.tipo === 'sessione') openSessionObj(obj, true);
    else if (obj.tipo !== 'template') toast('Il file non è una verifica né una valutazione di questa app', 'error');
    else if (want === 'eval') startSession(obj);
    else openTemplateObj(obj, true);
  };
  return html`<div class="page">
    ${draft ? html`<div class="alert info row gap wrap">
      <span class="grow">C'è del lavoro non scaricato del ${fmtWhen(draft.savedAt)}${draft.tpl ? ' (verifica «' + Model.templateTitle(draft.tpl) + '»)' : ''}${draft.ses ? ' (valutazione' + (draft.ses.classe ? ' ' + draft.ses.classe : '') + ')' : ''}.</span>
      ${draft.tpl ? html`<button class="btn small" onClick=${() => openTemplateObj(draft.tpl, false)}>Riprendi verifica</button>` : null}
      ${draft.ses ? html`<button class="btn small" onClick=${() => openSessionObj(draft.ses, false)}>Riprendi valutazione</button>` : null}
      <button class="btn small" onClick=${() => { Draft.clear(); refresh(); }}>Scarta</button>
    </div>` : null}
    <div class="home-grid">
      <section class="card mode">
        <div class="mode-icon">✎</div>
        <h2>Creazione verifica</h2>
        <p class="muted">Indicatori, livelli, domande da valutare, domande chiuse e versioni DSA / NAI / PEI. Esporta la griglia in PDF o HTML.</p>
        <div class="row gap wrap">
          <button class="btn primary" onClick=${() => openTemplateObj(Model.newTemplate(), false)}>Nuova verifica</button>
          <button class="btn" onClick=${() => openJSON('edit')}>Apri verifica (JSON)</button>
        </div>
      </section>
      <section class="card mode">
        <div class="mode-icon">✓</div>
        <h2>Valutazione</h2>
        <p class="muted">Applica una verifica a una classe, inserisci i punteggi e ottieni voto, griglie per studente e riepilogo.</p>
        <div class="row gap wrap">
          <button class="btn primary" title="Scegli il JSON della verifica da applicare alla classe" onClick=${() => openJSON('eval')}>Nuova valutazione da verifica (JSON)</button>
          <button class="btn" title="Scegli il JSON di una valutazione salvata" onClick=${() => openJSON('eval')}>Apri valutazione (JSON)</button>
        </div>
      </section>
    </div>
    <p class="muted small center">Verifiche e valutazioni si salvano come file JSON sul tuo computer: con «Salva» scarichi il file, con «Apri» lo riprendi.</p>
  </div>`;
}

/**
 * Se una schermata va in errore mentre viene disegnata, mostra il messaggio invece di
 * lasciare l'app bloccata, così si può tornare alla home e segnalare il problema.
 */
function Safe({ children }) {
  const [err, reset] = htmPreact.useErrorBoundary(e => {
    console.error(e);
    S.busy = null;
  });
  if (!err) return children;
  return html`<div class="page"><div class="alert warn">
    <h2>Si è verificato un errore in questa schermata</h2>
    <p>Il lavoro non salvato resta nella bozza del browser. Copia il messaggio qui sotto se vuoi segnalarlo.</p>
    <pre class="err-box">${String(err && err.message || err)}${'\n\nSchermata: ' + S.view + (S.view === 'builder' ? ' / ' + S.builderTab : S.view === 'session' ? ' / ' + S.sesTab : '') + ' · versione app ' + APP_VERSION}${err && err.stack ? '\n\n' + String(err.stack).split('\n').slice(0, 6).join('\n') : ''}</pre>
    <div class="row gap">
      <button class="btn primary" onClick=${() => { S.view = 'home'; S.busy = null; reset(); refresh(); }}>Torna alla home</button>
      <button class="btn" onClick=${() => { S.busy = null; reset(); refresh(); }}>Riprova</button>
    </div>
  </div></div>`;
}

function App() {
  const [, set] = useState(0);
  _bump = () => set(x => x + 1);
  const crumbs = { home: null, builder: 'Creazione verifica', session: 'Valutazione' }[S.view];
  return html`
    <header class="topbar">
      <button class="brand" onClick=${() => leaveTo('home')}><span class="logo">▦</span> Griglie di valutazione</button>
      ${crumbs ? html`<span class="crumb">› ${crumbs}</span>` : null}

    <main>
      <${Safe} key=${S.view}>${S.view === 'home' ? html`<${Home} />` : S.view === 'builder' ? html`<${Builder} />` : html`<${Session} />`}<//>
    </main>
    ${S.busy ? html`<div class="busy"><div class="spinner"></div>${S.busy}</div>` : null}
    <${Dialog} />
    ${S.toast ? html`<div class=${'toast ' + S.toast.kind} onClick=${() => { S.toast = null; refresh(); }}>${S.toast.msg}</div>` : null}`;
}

window.addEventListener('beforeunload', e => {
  if ((S.view === 'builder' && S.tplDirty) || (S.ses && S.sesRev !== S.savedRev)) { e.preventDefault(); e.returnValue = ''; }
});

(function boot() {
  const style = document.createElement('style');
  style.textContent = Grid.css;
  document.head.appendChild(style);
  render(html`<${App} />`, document.getElementById('app'));
})();

// per il debug dalla console del browser
window.GV = { S: S, U: U, Model: Model, Calc: Calc, Grid: Grid, Summary: Summary };
